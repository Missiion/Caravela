<script>
    // ─────────────────────────────────────────────────────────────
    // VIEWPORT-BASED SCALING (fallback para acesso directo)
    //
    // Quando este ficheiro é carregado dentro do iframe do game-launcher,
    // o zoom do parent (index.html) já escala o conteúdo visualmente.
    // O iframe vê innerWidth=1920 (layout do parent), pelo que scale=1
    // e este script é um no-op — correcto.
    //
    // Quando acedido directamente (sem parent), este script aplica o
    // mesmo scaling do hub para que o jogo cresça proporcionalmente
    // em resoluções maiores (1440p, 4K).
    // ─────────────────────────────────────────────────────────────
    (function() {
        var BASE_WIDTH = 1920;
        var styleEl = document.createElement('style');
        document.head.appendChild(styleEl);

        function applyScale() {
            var scale = window.innerWidth / BASE_WIDTH;
            window.__uiScale = scale;
            if (scale === 1) {
                styleEl.textContent = '';
                return;
            }
            var inv = (1 / scale) * 100;
            // height (não min-height) para sobrepor o height:100vh do CSS
            styleEl.textContent =
                'body { zoom: ' + scale + ';' +
                ' width: ' + inv + 'vw !important;' +
                ' height: ' + inv + 'vh !important; }';
        }

        applyScale();

        var rt = null;
        window.addEventListener('resize', function() {
            if (rt) clearTimeout(rt);
            rt = setTimeout(applyScale, 100);
        });
    })();
</script>
<style>

  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    cursor: default;
    perspective: 900px;
    perspective-origin: 50% 50%;
  }
  #wrap {
    position: relative;
    width: 540px;
    height: 700px;
  }
  canvas {
    display: block;
    cursor: none;
    border-radius: 0;
  }
  /* Borda no wrap */
  #wrap {
    outline: 2px solid var(--cor-borda-principal, #283593);
    box-shadow: 6px 6px 0 var(--cor-sombra, #b71c1c);
    will-change: transform;
  }
  #ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  /* Hide score/lives when not in-game */
  #ui.ui-hidden { opacity: 0; }
  #score-display {

    top: 18px; right: 22px;
    font-family: 'Bangers', cursive;

    text-shadow: 3px 3px 0 #c00, -1px -1px 0 #c00, 0 0 20px rgba(255,100,0,0.8);

    line-height: 1;
  }
  #score-label {
    font-size: 13px;

    top: 20px; left: 20px;
    display: flex;
    gap: 8px;
  }
  .life-icon {
    font-size: 28px;
    filter: drop-shadow(0 0 6px rgba(255,80,0,0.8));
    transition: all 0.3s;
  }
  .life-icon.lost { opacity: 0.15; filter: grayscale(1); }
  /* ── Panels — menu / pause / gameover ── */
  .panel {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    z-index: 20;
  }
  .panel.hidden { display: none !important; }
  .overlay-bg {
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    background: radial-gradient(ellipse at center, rgba(20,0,0,0.92) 0%, rgba(0,0,0,0.97) 100%);
    pointer-events: none;
    z-index: 0;
  }
  .pause-bg {
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.40);
    pointer-events: none;
    z-index: 0;
  }
  #pauseSnapshotWrap {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    display: none;
  }
  #panelPause:not(.hidden) #pauseSnapshotWrap {
    display: block;
  }
  #pauseSnapshot {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(3px);
    transform: scale(1.02);
    transform-origin: center center;
  }
  .overlay-content {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .game-title {
    font-family: 'Bangers', cursive;
    font-size: 72px;
    color: #ff4400;
    text-shadow: 4px 4px 0 #800, 0 0 30px rgba(255,80,0,0.6);
    letter-spacing: 6px;
    line-height: 0.9;
    margin-bottom: 6px;
  }
  .game-subtitle {
    font-family: 'Bangers', cursive;
    font-size: 28px;
    color: #ffcc44;
    letter-spacing: 8px;
    margin-bottom: 32px;
    text-shadow: 2px 2px 0 #880;
  }
  .final-score {
    font-family: 'Bangers', cursive;
    font-size: 42px;
    color: #fff;
    margin-bottom: 4px;
    text-shadow: 2px 2px 0 #c00;
  }
  .high-score {
    font-family: 'Bangers', cursive;
    font-size: 20px;
    color: #ffcc44;
    margin-bottom: 8px;
    letter-spacing: 3px;
  }
  .menu-btn {
    font-family: 'Bangers', cursive;
    font-size: 24px;

    border-radius: 2px;
    box-shadow: 0 5px 0 #660000, 0 0 22px rgba(255,80,0,0.35);
    transition: transform 0.1s, box-shadow 0.1s, background 0.12s;
    text-shadow: 1px 1px 0 #800;
    width: 220px;
    margin-bottom: 10px;
  }
  .menu-btn:hover  { background: linear-gradient(135deg, #dd3300, #ff8800); transform: translateY(-1px); }
  .menu-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #660000; }
  .menu-btn.secondary {
    font-size: 19px;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #1a1a2e, #2a2a4a);
    border-color: #4455aa;
    box-shadow: 0 5px 0 #111133, 0 0 18px rgba(80,100,255,0.2);
  }
  .menu-btn.secondary:hover { background: linear-gradient(135deg, #222244, #333366); }
  .menu-btn.danger {
    font-size: 19px;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #550000, #880000);
    border-color: #cc3333;
    box-shadow: 0 5px 0 #220000;
  }
  .menu-btn.danger:hover { background: linear-gradient(135deg, #660000, #aa0000); }
  .menu-btn.disabled {
    opacity: 0.38;

    pointer-events: none;

  .fruit-deco {
    font-size: 36px;
    margin-bottom: 20px;

  #skull-rain, #fruit-rain {

    inset: 0;

    overflow: hidden;
    z-index: 2;
  }
  .falling-skull, .falling-fruit {
    position: absolute;
    top: -60px;
    font-size: 32px;
    animation: skullFall linear forwards;
    opacity: 0.85;
    filter: drop-shadow(0 0 6px rgba(255,0,0,0.5));
  }
  .falling-fruit {

  .hint {
    font-family: 'Bangers', cursive;
    font-size: 14px;
    color: #ff8844;
    letter-spacing: 3px;
    margin-top: 16px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .hint-text {
    opacity: 0;

    white-space: nowrap;
    text-align: center;
  }
  .hint-text.visible {
    opacity: 0.85;
  }
  .pause-title {
    font-family: 'Bangers', cursive;
    font-size: 58px;
    color: #ffcc44;
    text-shadow: 3px 3px 0 #880, 0 0 28px rgba(255,200,0,0.5);
    letter-spacing: 10px;
    margin-bottom: 28px;
  }
  .menu-sep {
    width: 180px;
    height: 1px;
    background: rgba(255,100,0,0.22);
    margin: 4px 0 12px;
  }
  /* ── Volume control ── */
  .vol-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    width: 220px;
    box-sizing: border-box;
  }
  .vol-icon {
    font-size: 18px;
    width: 22px;
    text-align: center;
    line-height: 1;
    flex-shrink: 0;
    filter: drop-shadow(0 0 4px rgba(255,120,0,0.7));
    cursor: pointer;
    user-select: none;
  }
  .vol-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(to right, #ff6600 var(--val, 50%), rgba(255,255,255,0.15) var(--val, 50%));
    outline: none;
    cursor: pointer;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(255,100,0,0.8);
    cursor: pointer;
  }
  .vol-slider::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    border: none;
    box-shadow: 0 0 6px rgba(255,100,0,0.8);
    cursor: pointer;
  }
  .vol-label {
    font-family: 'Bangers', cursive;
    font-size: 15px;
    color: #ff8844;
    letter-spacing: 1px;
    width: 34px;
    text-align: right;
    flex-shrink: 0;
  }
  /* ── Leaderboard panel ── */
  #panelLeader .overlay-content {
    display: block;
    padding: 0;
  }

  /* Corner back button — triangle shape via clip-path */
  #btnLeaderBack {
    position: absolute;
    top: 0; left: 0;
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #cc2200 40%, #ff6600 100%);
    border: none;
    clip-path: polygon(0 0, 100% 0, 0 100%);
    cursor: pointer;
    z-index: 20;
    color: #fff;
    transition: filter 0.12s;
  }
  #btnLeaderBack:hover  { filter: brightness(1.2); }
  #btnLeaderBack:active { filter: brightness(0.85); }
  #btnLeaderBack svg {
    position: absolute;
    top: 14px; left: 10px;
    width: 24px; height: 24px;
  }

  /* Title — centred at top */
  #leaderTitle {
    position: absolute;
    top: 22px; left: 0; right: 0;
    text-align: center;
    font-family: 'Bangers', cursive;
    font-size: 48px;
    letter-spacing: 8px;
    color: #ff4400;
    text-shadow: 3px 3px 0 #800, 0 0 28px rgba(255,80,0,0.5);
    line-height: 1;
    z-index: 10;
    pointer-events: none;
  }

  /* Cards container */
  #leaderList {
    position: absolute;
    top: 92px; left: 0; right: 0; bottom: 0;
    padding: 0 28px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  #leaderList::-webkit-scrollbar { width: 4px; }
  #leaderList::-webkit-scrollbar-thumb { background: rgba(255,100,0,0.3); border-radius: 2px; }

  /* Individual cards */
  .lb-card {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.04);
    gap: 14px;
    flex-shrink: 0;
  }
  .lb-card.lb-top1 { background: linear-gradient(135deg, rgba(255,215,0,0.12), rgba(180,120,0,0.07)); border-color: rgba(255,215,0,0.35); }
  .lb-card.lb-top2 { background: linear-gradient(135deg, rgba(192,192,192,0.09), rgba(120,120,120,0.05)); border-color: rgba(192,192,192,0.25); }
  .lb-card.lb-top3 { background: linear-gradient(135deg, rgba(205,127,50,0.09), rgba(140,80,20,0.05)); border-color: rgba(205,127,50,0.25); }
  .lb-medal { font-size: 22px; width: 28px; text-align: center; flex-shrink: 0; }
  .lb-rank  { font-family: 'Bangers', cursive; font-size: 18px; color: #888; width: 28px; text-align: center; flex-shrink: 0; }
  .lb-info  { flex: 1; display: flex; flex-direction: column; }
  .lb-name  { font-family: 'Bangers', cursive; font-size: 20px; color: #fff; letter-spacing: 2px; }
  .lb-date  { font-family: sans-serif; font-size: 12px; color: #555; margin-top: 1px; }
  .lb-score { font-family: 'Bangers', cursive; font-size: 24px; color: #ffcc44; letter-spacing: 1px; }
  .lb-empty { font-family: 'Bangers', cursive; font-size: 20px; color: #444; letter-spacing: 4px; text-align: center; margin-top: 40px; }
  /* Entrada do próprio utilizador */
  .lb-card.lb-mine { border-color: rgba(255,140,0,0.55) !important; background: rgba(255,120,0,0.08) !important; }
  /* Aviso novo recorde no game over */
  #fn-hs-notice {
    font-family: 'Bangers', cursive;
    font-size: 18px;
    letter-spacing: 4px;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.7);
    opacity: 0;
    height: 1.4em;
    pointer-events: none;
    transition: opacity 0.4s ease;
    margin-bottom: 4px;
  }
  #fn-hs-notice.visible {
    animation: fn-hs-fade 3.5s ease forwards;
  }
  @keyframes fn-hs-fade {
    0%   { opacity: 0; }
    15%  { opacity: 1; }
    75%  { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="540" height="700"></canvas>
  <div id="ui" class="ui-hidden">
    <div id="lives">
      <span class="life-icon" id="l0">❤️</span>
      <span class="life-icon" id="l1">❤️</span>
      <span class="life-icon" id="l2">❤️</span>
    </div>
    <div id="score-display">

      <div id="score-val">0</div>
    </div>
  </div>
  <!-- ── MAIN MENU ── -->
  <div id="panelMenu" class="panel">
    <canvas id="menuBgCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
    <div id="fruit-rain"></div>
    <div class="overlay-content">
      <div class="game-title">FRUIT</div>
      <div class="game-subtitle">NINJA</div>

      <button class="menu-btn secondary" id="btnLeaderMain">LEADERBOARDS</button>

      <div class="vol-wrap">
        <span class="vol-icon" id="volIconMain">🔊</span>
        <input type="range" class="vol-slider" id="volSliderMain" min="0" max="100" value="25">
        <span class="vol-label" id="volLabelMain">50%</span>
      </div>
      <div class="hint" id="hintMain"><span class="hint-text"></span></div>
    </div>
  </div>

  <!-- ── GAME OVER ── -->
  <div id="panelGameOver" class="panel hidden">
    <canvas id="gameoverBgCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;" width="540" height="700"></canvas>
    <div id="skull-rain"></div>
    <div class="overlay-content">
      <div style="display:flex;flex-direction:column;align-items:flex-start;margin-bottom:18px;line-height:0.85">
        <div class="game-title" style="color:#ff2200;margin-left:-10px;margin-bottom:0">GAME</div>
        <div class="game-title" style="color:#ff6644;margin-left:30px;font-size:72px">OVER</div>

      <div id="fn-hs-notice">🏆 NEW RECORD!</div>
      <button class="menu-btn" id="btnRestart" style="margin-top:12px">PLAY AGAIN</button>
      <button class="menu-btn danger" id="btnMenuFromOver">MENU</button>
    </div>
  </div>

  <!-- ── PAUSE ── -->
  <div id="panelPause" class="panel hidden">
    <div id="pauseSnapshotWrap">
      <img id="pauseSnapshot" src="" alt="">
    </div>
    <div class="pause-bg"></div>
    <div class="overlay-content">
      <div class="pause-title" id="pauseTitle">PAUSE</div>
      <button class="menu-btn" id="btnResume">▶ RESUME</button>
      <button class="menu-btn" id="btnRestartFromPause">↺ RESTART</button>
      <button class="menu-btn danger" id="btnMenuFromPause">MENU</button>
      <div class="vol-wrap">
        <span class="vol-icon" id="volIconPause">🔊</span>
        <input type="range" class="vol-slider" id="volSliderPause" min="0" max="100" value="25">
        <span class="vol-label" id="volLabelPause">50%</span>
      </div>
      <div class="hint" id="hintPause" style="margin-top:14px"><span class="hint-text"></span></div>
    </div>
  </div>
  <!-- ── LEADERBOARD ── -->
  <div id="panelLeader" class="panel hidden">
    <canvas id="lbBgCanvas" width="540" height="700" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>
    <div class="overlay-content" style="position:relative;z-index:10;width:100%;height:100%;align-items:stretch;padding:0;">

      <!-- Corner back button -->
      <button id="btnLeaderBack" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="15,4 7,12 15,20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Title top-right -->
      <div id="leaderTitle">LEADERBOARD</div>

      <!-- Cards list -->
      <div id="leaderList"></div>

    </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 540, H = 700;

// ── FRUIT DEFINITIONS ─────────────────────────────────────────────
const FRUITS = [
  { name:'watermelon', r:38, outer:'#2d8a2d', inner:'#e83030', seed:'#1a0a00',
    highlight:'#4aaa4a', stripe:'#1a6a1a' },
  { name:'orange',     r:32, outer:'#e87820', inner:'#f4a020', seed:'#5a3010',
    highlight:'#f0a040', stripe:'#c05a10' },
  { name:'apple',      r:30, outer:'#e02020', inner:'#f06060', seed:'#1a0800',
    highlight:'#f04040', stripe:'#a01010' },
  { name:'lemon',      r:28, outer:'#e8d020', inner:'#f8f060', seed:'#605010',
    highlight:'#f8e840', stripe:'#c0a010' },
  { name:'peach',      r:30, outer:'#f08040', inner:'#f8c080', seed:'#5a2810',
    highlight:'#f8b060', stripe:'#d06020' },
  { name:'grape',      r:26, outer:'#8020c0', inner:'#b060e0', seed:'#200840',
    highlight:'#a040d0', stripe:'#601090' },
  { name:'pineapple',  r:34, outer:'#c89020', inner:'#f0d040', seed:'#604010',
    highlight:'#e0b030', stripe:'#a07010' },
  { name:'strawberry', r:26, outer:'#e02040', inner:'#f06080', seed:'#1a0810',
    highlight:'#f04060', stripe:'#a01030' },
  { name:'coconut',    r:42, outer:'#5a3a1a', inner:'#f5e8c8', seed:'#2a1808',
    highlight:'#8a6040', stripe:'#3a2010' },
  { name:'banana',     r:30, outer:'#e8d020', inner:'#fff8c0', seed:'#604010',
    highlight:'#f8e840', stripe:'#b09010' },
  { name:'blueberry',  r:22, outer:'#2a1870', inner:'#6050d0', seed:'#100840',
    highlight:'#6060e0', stripe:'#180c50' },
  { name:'cherry',     r:20, outer:'#c00828', inner:'#ff5060', seed:'#3a0010',
    highlight:'#e03050', stripe:'#800018' },
  { name:'pomegranate', r:34, outer:'#c82020', inner:'#ffe8c0', seed:'#8b0000',
    highlight:'#e84040', stripe:'#8a1010' },
];

const BOMB = { name:'bomb', r:28 };

// ══════════════════════════════════════════════════════════════════
// ── POSIÇÃO DO CONTROLO DE VOLUME ─────────────────────────────────
//    Aplica-se ao menu principal E ao menu de pausa ao mesmo tempo.
//    Altera os valores abaixo para reposicionar o emoji, a barra e
//    a percentagem sem tocar em mais nada no código.
// ──────────────────────────────────────────────────────────────────
const VOL_POSITION = {
  // Margem superior (px) entre os botões e o controlo de volume
  marginTop: 14,

  // Largura total do bloco (px) — deve ser igual à largura dos botões
  width: 220,

  // Espaço entre o emoji, a barra e a percentagem (px)
  gap: 10,

  // Tamanho do emoji de volume (px)
  iconSize: 18,

  // Largura fixa do contentor do emoji (px) — garante alinhamento exacto
  iconWidth: 22,

  // Tamanho do texto de percentagem (px)
  labelSize: 15,

  // Largura reservada para o texto da percentagem (px)
  labelWidth: 34,
};
// ══════════════════════════════════════════════════════════════════

// ── VOLUME GLOBAL (0.0 → 1.0, default 50%) ────────────────────────
let masterVolume = 0.25;

function syncVolumeUI(val) {
  masterVolume = val / 100;

// ── SHAKE ─────────────────────────────────────────────────────────
const wrapEl = document.getElementById('wrap');
let shakeAmp = 0;
let shakeDuration = 0;
let shakeDecay = 0;
let shakeOX = 0, shakeOY = 0; // offset actual do shake

function triggerShake(amp, duration) {
  shakeAmp = Math.max(shakeAmp, amp);
  shakeDuration = duration;
  shakeDecay = amp / duration;
}

function updateShake(dt) {
  if (shakeDuration > 0) {
    shakeDuration -= dt;
    if (shakeDuration <= 0) {
      shakeDuration = 0;
      shakeDecay = shakeAmp / 0.5;
    }
  } else if (shakeAmp > 0) {
    shakeAmp = Math.max(0, shakeAmp - shakeDecay * dt);
  }

  const maxPx = 11.52;
  if (shakeAmp < 0.001) {
    shakeOX = 0; shakeOY = 0;
  } else {
    const px = shakeAmp * maxPx;
    shakeOX = (Math.random() * 2 - 1) * px;
    shakeOY = (Math.random() * 2 - 1) * px;
  }
}

// Aplica shake + parallax num único transform — chamado pelo loop do parallax
function applyWrapTransform(rx, ry) {
  const t = shakeOX !== 0 || shakeOY !== 0
    ? `translate(${shakeOX.toFixed(1)}px,${shakeOY.toFixed(1)}px) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg)`
    : `rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg)`;
  wrapEl.style.transform = t;
}

// ── SOUNDS ────────────────────────────────────────────────────────
// Usamos AudioContext para controlar pitch (playbackRate)
// O AudioContext só pode ser criado após interação do utilizador
let _actx = null;
function getACtx() {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  return _actx;
}

// Carrega um URL e guarda o AudioBuffer (via jsDelivr)
function makeSound(filename) {
  const url = 'https://cdn.jsdelivr.net/gh/Missiion/Caravela@main/' + filename;
  const obj = { buffer: null };
  fetch(url)
    .then(r => r.arrayBuffer())
    .then(ab => getACtx().decodeAudioData(ab))
    .then(buf => { obj.buffer = buf; })
    .catch(() => {
      // fallback: Audio element sem pitch control
      obj.fallback = new Audio(url);
      obj.fallback.preload = 'auto';
    });
  return obj;
}

// Toca um som com pitch aleatório dentro de [base - range, base + range]
// pitchBase = 1.0 → velocidade normal; range = 0.12 → ±12%
function playSound(snd, volume = 0.7, pitchBase = 1.0, pitchRange = 0.0) {
  const vol   = volume * masterVolume;
  if (vol <= 0) return;
  const pitch = pitchBase + (Math.random() * 2 - 1) * pitchRange;
  if (snd.buffer) {
    try {
      const actx = getACtx();
      const src  = actx.createBufferSource();
      const gain = actx.createGain();
      src.buffer = snd.buffer;
      src.playbackRate.value = pitch;
      gain.gain.value = vol;
      src.connect(gain);
      gain.connect(actx.destination);
      src.start(0);
    } catch(e) {}
  } else if (snd.fallback) {
    const c = snd.fallback.cloneNode();
    c.volume = Math.min(1, vol);
    c.playbackRate = pitch;
    c.play().catch(() => {});
  }
}

// RNG para slash trails (seedable, estável entre frames)
function mulberry32_slash(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

// ── ESTRELAS COM FADE + COMETAS RAROS ─────────────────────────────
const NUM_STARS = 160;
let gameStars = [];
let comets = [];
let cometTimer = 0;
let nextCometIn = 15 + Math.random() * 20;

function initGameStars() {
  gameStars = [];
  for (let i = 0; i < NUM_STARS; i++) {
    gameStars.push(makeStar(true));
  }
}

function makeStar(randomPos) {
  return {
    x: randomPos ? ((Math.floor(Math.random()*10000) * 137.508 + 23) % W) : (Math.random() * W),
    y: randomPos ? ((Math.floor(Math.random()*10000) * 97.3  + 11) % H) : (Math.random() * H),
    r: 0.3 + Math.random() * 1.2,
    twinklePhase: Math.random() * Math.PI * 2,
    twinkleSpeed: 0.5 + Math.random() * 1.5,
    // fade cycle
    alpha: Math.random(),       // começa em alpha aleatório
    fadeDir: Math.random() < 0.5 ? 1 : -1,
    fadeSpeed: 0.002 + Math.random() * 0.006,
    maxAlpha: 0.4 + Math.random() * 0.6,
  };
}

function updateGameStars(dt) {
  for (let s of gameStars) {
    // Twinkle rápido por cima do fade lento
    s.twinklePhase += s.twinkleSpeed * dt;

    // Fade lento in/out
    s.alpha += s.fadeDir * s.fadeSpeed;
    if (s.alpha >= s.maxAlpha) {
      s.alpha = s.maxAlpha;
      s.fadeDir = -1;
    } else if (s.alpha <= 0) {
      // Morreu — nasce noutro sítio
      Object.assign(s, makeStar(false));
      s.alpha = 0;
      s.fadeDir = 1;
    }
  }

  // Cometas
  cometTimer += dt;
  if (cometTimer >= nextCometIn) {
    cometTimer = 0;
    nextCometIn = 15 + Math.random() * 20;
    spawnComet();
  }
  for (let c of comets) {
    c.x += c.vx; c.y += c.vy;
    const out = c.x < -c.len*2 || c.x > W+c.len*2 || c.y < -c.len*2 || c.y > H+c.len*2;
    if (out) c.life -= dt * 3;
    else { c.alpha = Math.min(1, c.alpha + dt * 5); }
  }
  comets = comets.filter(c => c.life > 0);
}

function spawnComet() {
  // Entra por qualquer dos 4 lados, ângulo variado
  const side = Math.floor(Math.random() * 4); // 0=esq 1=dir 2=topo 3=fundo
  let x, y, baseAngle;
  if (side === 0) { x = -12; y = Math.random() * H; baseAngle = -0.45 + Math.random() * 0.9; }
  else if (side === 1) { x = W+12; y = Math.random() * H; baseAngle = Math.PI - 0.45 + Math.random() * 0.9; }
  else if (side === 2) { x = Math.random() * W; y = -12; baseAngle = Math.PI*0.5 - 0.45 + Math.random() * 0.9; }
  else { x = Math.random() * W; y = H+12; baseAngle = -Math.PI*0.5 - 0.45 + Math.random() * 0.9; }
  const speed = 4 + Math.random() * 4;
  comets.push({
    x, y,
    vx: Math.cos(baseAngle) * speed,
    vy: Math.sin(baseAngle) * speed,
    len: 55 + Math.random() * 70,
    r: 1.2 + Math.random() * 1.2,
    alpha: 0, life: 1.0,
    color: Math.random() < 0.4 ? '#c8d8ff' : Math.random() < 0.3 ? '#fff8c0' : '#ffffff',
  });
}

function drawGameStars() {
  for (let s of gameStars) {
    const twinkle = 0.5 + 0.5 * Math.sin(s.twinklePhase);
    const a = s.alpha * (0.45 + 0.55 * twinkle);
    if (a < 0.01) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(230,225,210,1)';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let c of comets) {
    if (c.alpha < 0.01) continue;
    const angle = Math.atan2(c.vy, c.vx);
    const tx = c.x - Math.cos(angle) * c.len;
    const ty = c.y - Math.sin(angle) * c.len;
    const grad = ctx.createLinearGradient(c.x, c.y, tx, ty);
    grad.addColorStop(0,   `rgba(255,255,255,${c.alpha * 0.92})`);
    grad.addColorStop(0.25,`rgba(210,225,255,${c.alpha * 0.45})`);
    grad.addColorStop(1,   'rgba(180,200,255,0)');
    ctx.globalAlpha = 1;
    ctx.strokeStyle = grad;
    ctx.lineWidth = c.r * 1.3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(tx, ty); ctx.stroke();
    // núcleo
    ctx.globalAlpha = c.alpha;
    const cg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * 3);
    cg.addColorStop(0, '#ffffff');
    cg.addColorStop(0.4, c.color);
    cg.addColorStop(1, 'rgba(200,220,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const rect = () => canvas.getBoundingClientRect();

// Converte coordenadas do ecrã para coordenadas do canvas (sem clamp — permite sair das bordas)
function toCanvasCoords(clientX, clientY) {
  const r = rect();
  return {
    x: (clientX - r.left) * (W / r.width),
    y: (clientY - r.top)  * (H / r.height),
  };
}

canvas.addEventListener('mousedown', e => {
  isSlicing = true;
  if (_actx && _actx.state === 'suspended') _actx.resume();
  const { x, y } = toCanvasCoords(e.clientX, e.clientY);
  mouseX = x; mouseY = y;
  addBlade(mouseX, mouseY);
});

// mousemove e mouseup no document — assim o corte não para nas bordas
document.addEventListener('mousemove', e => {
  const { x, y } = toCanvasCoords(e.clientX, e.clientY);
  prevMX = mouseX; prevMY = mouseY;
  mouseX = x; mouseY = y;
  if (isSlicing) addBlade(mouseX, mouseY);
});

});

// Touch
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  isSlicing = true;
  if (_actx && _actx.state === 'suspended') _actx.resume();
  const r = rect();
  const t = e.touches[0];
  mouseX = (t.clientX - r.left) * (W / r.width);
  mouseY = (t.clientY - r.top)  * (H / r.height);
  addBlade(mouseX, mouseY);
}, { passive: false });

}, { passive: false });
canvas.addEventListener('touchend', () => { isSlicing = false; bladeTrail = []; });

function addBlade(x, y) {
  bladeTrail.push({ x, y, life: 1 });
  if (bladeTrail.length > 28) bladeTrail.shift();

  // Rastro de carvão dinâmico — gerado enquanto o rato está premido
  if (state === 'playing' && bladeTrail.length >= 2) {
    const prev = bladeTrail[bladeTrail.length - 2];
    const dx = x - prev.x, dy = y - prev.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 4) { // só se houver movimento suficiente
      const ang = Math.atan2(dy, dx);
      const HALF = 28;
      const rng = mulberry32_slash(Math.round(x * 17 + y * 31 + dist));
      const smears = [];
      for (let i = 0; i < 10; i++) {
        smears.push({
          offN:  (rng()-0.5) * 8,
          offT:  (rng()-0.5) * 5,
          hw:    1.0 + rng() * 5,
          ta:    0.05 + rng() * 0.18,
          len:   0.5 + rng() * 0.45,
          start: rng() * 0.15,
        });
      }
      slashTrails.push({
        cx: (x + prev.x) / 2,
        cy: (y + prev.y) / 2,
        ang, life: 1.0, smears, HALF,
        dynamic: true, // fade mais rápido para o rastro contínuo
      });
    }
  }
}

// O localStorage não é partilhado cross-frame.
// O pai envia browserId e sigName via postMessage (FN_USER_INFO).

let _fnBrowserId = null;
let _fnSigName   = '???';
let _fnUserReady = false;
const _fnUserCallbacks = [];

// Receber info do utilizador do pai
window.addEventListener('message', function(e) {
  if (e.data && e.data.tipo === 'FN_USER_INFO') {
    _fnBrowserId = e.data.bid  || null;
    _fnSigName   = (e.data.name || '???').toUpperCase();
    _fnUserReady = true;
    _fnUserCallbacks.forEach(cb => cb());
    _fnUserCallbacks.length = 0;
  }
});

function fnGetBrowserId() { return _fnBrowserId; }
function fnGetSigName()   { return _fnSigName; }

// Aguarda até ter o browserId do pai
function fnWaitForUser() {
  return new Promise(resolve => {
    if (_fnUserReady) { resolve(); return; }
    _fnUserCallbacks.push(resolve);
    // Pedir ao pai
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ tipo: 'PEDIR_USER_INFO' }, '*');
    }
    setTimeout(resolve, 5000); // timeout de segurança
  });
}

// Pedir user info ao pai assim que o iframe carrega
if (window.parent && window.parent !== window) {
  window.parent.postMessage({ tipo: 'PEDIR_USER_INFO' }, '*');
}

// Mapa de callbacks pendentes para respostas do pai
const _fnCallbacks = {};
let   _fnCallId    = 0;

// Envia pedido ao pai e devolve uma Promise com a resposta
function fnAsk(tipo, payload) {
  return new Promise(resolve => {
    const id = ++_fnCallId;
    _fnCallbacks[id] = resolve;
    try {
      window.parent.postMessage({ tipo, id, ...payload }, '*');
    } catch(e) {
      console.error('[FN iframe] postMessage falhou:', e);
      resolve(null);
    }
    // Timeout de segurança: 8 segundos
    setTimeout(() => {
      if (_fnCallbacks[id]) {
        console.warn('[FN iframe] timeout sem resposta para:', tipo, 'id:', id);
        delete _fnCallbacks[id]; resolve(null);
      }
    }, 8000);
  });
}

// Receber respostas do pai
window.addEventListener('message', function(e) {
  if (e.data && e.data.tipo === 'FN_RESP') {
    if (_fnCallbacks[e.data.id]) {
      const cb = _fnCallbacks[e.data.id];
      delete _fnCallbacks[e.data.id];
      cb(e.data.value);
    }
  }
});

async function lbAddScore(pts) {
  if (pts <= 0) return;
  await fnWaitForUser(); // garante que temos o browserId do pai
  const bid  = fnGetBrowserId();
  const name = fnGetSigName();
  if (!bid) {
    console.warn('[FN iframe] sem browserId — utilizador sem assinatura.');

  const existing = await fnAsk('FN_GET_SCORE', { bid });
  if (existing === null || existing === undefined || pts > Number(existing)) {
    await fnAsk('FN_SET_SCORE', { bid, score: pts });

    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }
});

// Mudança de tab → pausa automática
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') pauseGame();
});

function showPanel(name) {
  document.getElementById('panelMenu').classList.toggle('hidden',     name !== 'menu');
  document.getElementById('panelGameOver').classList.toggle('hidden', name !== 'gameover');
  document.getElementById('panelPause').classList.toggle('hidden',    name !== 'pause');
  document.getElementById('panelLeader').classList.toggle('hidden',   name !== 'leader');
  document.getElementById('ui').classList.toggle('ui-hidden', name !== 'none');
  if (name !== 'none' && name !== 'pause') ctx.clearRect(0, 0, W, H);
  if (name === 'menu') startFruitRain(); else stopFruitRain();
  // Esconder o canvas de background do game over quando não está no game over
  // (evita que o último frame apareça atrás do leaderboard)
  const goBg = document.getElementById('gameoverBgCanvas');
  if (goBg) goBg.style.visibility = (name === 'gameover') ? 'visible' : 'hidden';
}
function startGame() {
  score = 0; lives = 3; combo = 0; gameTime = 0; timeScale = 0.25;
  fruits = []; slices = []; particles = []; comboTexts = [];
  bladeTrail = []; slashTrails = []; slashParticles = [];
  spawnTimer = 0; spawnInterval = 0.8;
  updateLives();
  updateScore();
  state = 'playing';
  showPanel('none');
}

function pauseGame() {
  state = 'paused';
  // Capture current game frame as blurred background
  const snap = document.getElementById('pauseSnapshot');
  snap.src = canvas.toDataURL();
  showPanel('pause');
}

function resumeGame() {
  state = 'playing';
  showPanel('none');
  lastTime = performance.now(); // prevent dt spike after pause
}

function updateScore() {
  document.getElementById('score-val').textContent = score;
}
function updateLives() {
  for (let i = 0; i < 3; i++) {
    document.getElementById('l'+i).classList.toggle('lost', i >= lives);
  }
}

// ── SPAWN ─────────────────────────────────────────────────────────
// Apex garantido: vy = sqrt(2 * gravity * apexPx)
// Com física sem timeScale: apex = vy² / (2*gravity) — matemática pura, sempre exacto.
// Gravity baixa no início → frutas sobem e caem DEVAGAR mas chegam SEMPRE à altura certa.
function vyForApex(apexPx, gravity) {
  return Math.sqrt(2 * gravity * apexPx);
}

function spawnFruit() {
  const difficulty  = Math.min(1.0, gameTime / 480); // máximo aos ~8 minutos em vez de 5
  const bombChance  = gameTime < 45 ? 0 : Math.min(0.20, (gameTime - 45) / 435 * 0.20); // ligeiramente mais bombas (max 20%)

  // Gravity * 2 porque ft = dt*60 e a 120Hz dt=0.00833 → ft=0.5, então *2 restaura velocidade original
  const gravity = 0.12 + difficulty * 0.40;

  // Apex SEMPRE garantido pela matemática
  const apexMin   = H * 0.52;
  const apexMax   = H * (0.65 + difficulty * 0.13);
  const apexRange = apexMax - apexMin;

  const maxVX = 1.6 + difficulty * 4.0; // *2 para compensar ft=0.5 a 120Hz

  // Grupos — ficam frequentes mais devagar
  const waveRoll      = Math.random();
  const arcChance     = Math.min(0.75, gameTime < 10 ? 0.20 : 0.20 + (gameTime - 10) / 170 * 0.55);
  const tripleChance  = Math.min(0.45, gameTime < 30 ? 0.10 : 0.10 + (gameTime - 30) / 210 * 0.35);
  const bigWaveChance = Math.min(0.25, gameTime < 60 ? 0    : (gameTime - 60) / 240 * 0.25);

  // Tamanho máximo do grupo cresce mais devagar
  const maxGroupSize = Math.round(2 + difficulty * 5); // 2 → 7

  if (waveRoll < bigWaveChance) {
    const count = Math.min(maxGroupSize, 4 + Math.floor(Math.random() * 3)); // 4–6 (ou mais tarde 7-8)
    spawnArc(count, apexMin, apexRange, maxVX, gravity, bombChance, difficulty);
  } else if (waveRoll < bigWaveChance + tripleChance) {
    const count = Math.min(maxGroupSize, 3 + Math.floor(Math.random() * 2)); // 3–4
    spawnArc(count, apexMin, apexRange, maxVX, gravity, bombChance, difficulty);
  } else if (waveRoll < bigWaveChance + tripleChance + arcChance) {
    spawnArc(2, apexMin, apexRange, maxVX, gravity, bombChance, difficulty);
  } else {
    // Fruta simples com apex aleatório dentro do intervalo
    const apex = apexMin + Math.random() * apexRange;
    const vy   = vyForApex(apex, gravity);
    // X central — nunca nos primeiros/últimos 15% da largura
    const x    = W * 0.15 + Math.random() * W * 0.70;
    // vx limitado para fruta não sair pelos lados
    const flightT = (2 * vy) / gravity;
    const vxSafe  = Math.min(maxVX, (Math.min(x - 40, W - 40 - x)) / flightT);
    launchFruit(x, vy, (Math.random() - 0.5) * 2 * Math.max(0, vxSafe), gravity, Math.random() < bombChance, difficulty);
  }
}

function spawnArc(count, apexMin, apexRange, maxVX, gravity, bombChance, difficulty) {
  // Variação de apex entre frutas do mesmo arco:
  // Início: ±5% (quase igual → combo fácil)
  // Fim:    ±20% (variado → mais difícil apanhar tudo)
  const apexSpreadFrac = 0.05 + difficulty * 0.15;

  // Spread horizontal: frutas próximas no início, mais afastadas no fim
  const xSpread = 50 + difficulty * 70; // 50px → 120px

  // Centro do arco — sempre na zona central (20%–80% da largura)
  const centerX = W * 0.20 + Math.random() * W * 0.60;

  // Delay entre frutas: lento no início (fácil ver e cortar), rápido no fim
  const baseDelay = Math.max(80, 320 - difficulty * 240); // 320ms → 80ms

  for (let i = 0; i < count; i++) {
    const delay  = i * (baseDelay + Math.random() * baseDelay * 0.3);
    const isBomb = Math.random() < bombChance * 0.7;

    // X de cada fruta — sempre dentro dos limites seguros
    const xOff = (i - (count - 1) / 2) * xSpread * (0.8 + Math.random() * 0.4);
    const x    = Math.max(W * 0.12, Math.min(W * 0.88, centerX + xOff));

    // Apex desta fruta — variação em torno do centro do intervalo
    const apexCenter = apexMin + apexRange * 0.5;
    const apexVar    = apexRange * apexSpreadFrac * (Math.random() - 0.5) * 2;
    const apex       = Math.max(apexMin, Math.min(apexMin + apexRange, apexCenter + apexVar));
    const vy         = vyForApex(apex, gravity);

    // vx seguro para não sair pelos lados
    const flightT = (2 * vy) / gravity;
    const vxSafe  = Math.min(maxVX, (Math.min(x - 40, W - 40 - x)) / flightT);
    const vx      = (Math.random() - 0.5) * 2 * Math.max(0, vxSafe);

    setTimeout(() => {
      if (state !== 'playing') return;
      launchFruit(x, vy, vx, gravity, isBomb, difficulty);
    }, delay);
  }
}

function launchFruit(x, vyMag, vx, gravity, isBomb, difficulty) {
  const spin = (Math.random() - 0.5) * (0.06 + difficulty * 0.14); // *2 para compensar ft
  if (isBomb) {
    fruits.push({ ...BOMB, x, y: H + 40, vx, vy: -vyMag, spin, rot: 0, sliced: false, gravity });
  } else {
    const fd = FRUITS[Math.floor(Math.random() * FRUITS.length)];
    fruits.push({ ...fd, x, y: H + 40, vx, vy: -vyMag, spin, rot: Math.random()*Math.PI*2, sliced: false, gravity });
  }
}

// ── SLICE DETECTION ───────────────────────────────────────────────
function checkSlice() {
  if (!isSlicing) return;
  if (bladeTrail.length < 2) return;
  const ax = bladeTrail[bladeTrail.length-2].x;
  const ay = bladeTrail[bladeTrail.length-2].y;
  const bx = mouseX, by = mouseY;
  const spd = Math.hypot(bx-ax, by-ay);
  if (spd < 3) return;

  for (let f of fruits) {
    if (f.sliced) continue;
    const dist = distToSegment(f.x, f.y, ax, ay, bx, by);
    if (dist < f.r) {
      f.sliced = true;
      if (f.name === 'bomb') {
        triggerBomb(f);
      } else {
        sliceFruit(f, ax, ay, bx, by);
      }
    }
  }
}

function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx-ax, dy = by-ay;
  const len2 = dx*dx+dy*dy;
  if (len2 === 0) return Math.hypot(px-ax, py-ay);
  let t = ((px-ax)*dx + (py-ay)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

function sliceFruit(f, ax, ay, bx, by) {
  // ── NOVO SISTEMA DE COMBO ──────────────────────────────────────
  // Cada corte incrementa o combo e reseta o timer para 1 segundo.
  // Se o timer chegar a 0 sem novo corte, o combo reseta.
  combo++;
  comboTimer = 1.0;

  // Shake subtil por combo — máx 30% (amp 0.3) ao combo 5+
  const comboShakeAmp = Math.min(1.728, (combo - 1) * 0.432);
  if (comboShakeAmp > 0) triggerShake(comboShakeAmp, 0.12);

  // Pontuação: base 1pt, multiplicada pelo combo
  const multiplier = Math.max(1, combo);
  const pts = multiplier;

  const prevScore = score;
  score += pts;
  if (score > best) best = score;

  // Vida extra a cada 100 pontos
  const prevHundred = Math.floor(prevScore / 100);
  const newHundred  = Math.floor(score / 100);
  if (newHundred > prevHundred && lives < 3) {
    lives = Math.min(3, lives + 1);
    updateLives();
    comboTexts.push({
      x: W/2, y: H/2 - 60,
      text: '❤️ VIDA RESTAURADA!', life: 1.6, color: '#ff4488', vy: -1.2
    });
  }

  updateScore();

  // Play random slice sound
  playSliceSound();

  // Slice angle
  const ang = Math.atan2(by-ay, bx-ax);

  // Sword slash flash trail — estilo carvão (demo 5), tamanho fixo
  (function() {
    const HALF = 55;
    const rng = mulberry32_slash(Math.round(f.x * 23 + f.y * 41));
    const smears = [];
    for (let i = 0; i < 22; i++) {
      smears.push({
        offN:  (rng()-0.5) * 12,
        offT:  (rng()-0.5) * 8,
        hw:    1.2 + rng() * 7,
        ta:    0.04 + rng() * 0.2,
        len:   0.5 + rng() * 0.45,
        start: rng() * 0.15,
      });
    }
    const ux = Math.cos(ang), uy = Math.sin(ang);
    const nx = -uy, ny = ux;
    for (let i = 0; i < 28; i++) {
      const t2 = rng();
      const px = (f.x - ux*HALF) + (ux*HALF*2)*t2 + nx*(rng()-0.5)*13;
      const py = (f.y - uy*HALF) + (uy*HALF*2)*t2 + ny*(rng()-0.5)*13;
      const spd2 = 0.4 + rng() * 2.0;
      const da   = rng() * Math.PI * 2;
      slashParticles.push({
        x: px, y: py,
        vx: Math.cos(da)*spd2, vy: Math.sin(da)*spd2 - 0.3,
        r: 0.5 + rng() * 2.2,
        life: 0.6 + rng() * 0.4,
        maxLife: 0.6 + rng() * 0.4,
        opacity: 0.25 + rng() * 0.55,
      });
    }
    slashTrails.push({ cx: f.x, cy: f.y, ang, life: 1.0, smears, HALF });
  })();

  // Two halves flying apart
  slices.push({
    x: f.x, y: f.y, rot: f.rot,
    vx: f.vx - Math.sin(ang)*6, vy: f.vy - 2,
    spin: f.spin - 0.10,
    fd: f, half: 'left', life: 1.4, sliceAng: ang
  });
  slices.push({
    x: f.x, y: f.y, rot: f.rot,
    vx: f.vx + Math.sin(ang)*6, vy: f.vy - 2,
    spin: f.spin + 0.10,
    fd: f, half: 'right', life: 1.4, sliceAng: ang
  });

  // Juice particles
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 6;
    particles.push({
      x: f.x, y: f.y,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd - 3,
      r: 2+Math.random()*4,
      color: f.inner, life: 1,
      type: 'juice'
    });
  }

  // Score pop text
  const scoreLabel = combo > 1 ? `x${combo} +${pts}` : `+1`;
  comboTexts.push({
    x: f.x, y: f.y - 30,
    text: scoreLabel,
    life: 1.0,
    color: combo >= 5 ? '#ff4400' : combo >= 3 ? '#ff8800' : '#ffffff',
    vy: -2.2
  });

  // Combo announcement (separate, above score pop)
  if (combo >= 2) {
    comboTexts.push({
      x: f.x, y: f.y - 60,
      text: combo >= 8 ? `🔥 ${combo}x COMBO!!` : combo >= 5 ? `🔥 ${combo}x COMBO!` : `${combo}x COMBO`,
      life: 1.0,
      color: combo >= 8 ? '#ff2200' : combo >= 5 ? '#ff4400' : '#ffcc00',
      vy: -1.5
    });
  }
}

function triggerBomb(f) {
  combo = 0;

  // Bomb sounds
  playBombSound();

  // Explosion particles
  for (let i = 0; i < 30; i++) {
    const a = Math.random()*Math.PI*2;
    const spd = 2 + Math.random()*9;
    particles.push({
      x: f.x, y: f.y,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd - 4,
      r: 3+Math.random()*6,
      color: ['#ff8800','#ffcc00','#ff3300','#fff'][Math.floor(Math.random()*4)],
      life: 1.2, type: 'explosion'
    });
  }

  // Clássico: bomba = game over imediato
  triggerShake(0.72, 0.4);
  shakeDecay = 0.72 / 2.0;
  lives = 0;
  updateLives();
  setTimeout(gameOver, 500);
}

function missedFruit(f) {
  if (f.name === 'bomb') return; // bombs don't count as missed
  lives = Math.max(0, lives - 1);
  combo = 0;
  updateLives();
  // Miss text
  comboTexts.push({
    x: f.x, y: H - 120,
    text: '✗ MISS', life: 1.2, color: '#ff3333', vy: -1.5
  });
  if (lives <= 0) setTimeout(gameOver, 400);
}

let _skullRainInterval = null;
let _fruitRainInterval = null;
const FRUIT_EMOJIS = ['🍉', '🍊', '🍋', '🍇', '🍓', '🍑', '🍍', '🥭', '🫐', '🍒', '🍎'];

function startFruitRain() {
  const container = document.getElementById('fruit-rain');
  container.innerHTML = '';
  if (_fruitRainInterval) clearInterval(_fruitRainInterval);

  function spawnFruit() {
    const s = document.createElement('div');
    s.className = 'falling-fruit';
    s.textContent = FRUIT_EMOJIS[Math.floor(Math.random() * FRUIT_EMOJIS.length)];
    s.style.left = (Math.random() * 480 + 20) + 'px';
    const duration = (4 + Math.random() * 4).toFixed(2);
    const delay    = (Math.random() * 2).toFixed(2);
    s.style.animationDuration = duration + 's';
    s.style.animationDelay   = delay + 's';
    s.style.fontSize = (24 + Math.random() * 20).toFixed(0) + 'px';
    container.appendChild(s);
    setTimeout(() => s.remove(), (parseFloat(duration) + parseFloat(delay)) * 1000 + 200);
  }

  for (let i = 0; i < 5; i++) spawnFruit();
  _fruitRainInterval = setInterval(spawnFruit, 600);
}

function stopFruitRain() {
  if (_fruitRainInterval) { clearInterval(_fruitRainInterval); _fruitRainInterval = null; }
  const container = document.getElementById('fruit-rain');
  if (container) container.innerHTML = '';
}

function startSkullRain() {
  const container = document.getElementById('skull-rain');
  container.innerHTML = '';
  if (_skullRainInterval) clearInterval(_skullRainInterval);

  function spawnSkull() {
    const s = document.createElement('div');
    s.className = 'falling-skull';
    s.textContent = '💀';
    s.style.left = (Math.random() * 480 + 20) + 'px';
    const duration = (4 + Math.random() * 4).toFixed(2);
    const delay    = (Math.random() * 2).toFixed(2);
    s.style.animationDuration = duration + 's';
    s.style.animationDelay   = delay + 's';
    s.style.fontSize = (24 + Math.random() * 20).toFixed(0) + 'px';
    container.appendChild(s);
    setTimeout(() => s.remove(), (parseFloat(duration) + parseFloat(delay)) * 1000 + 200);
  }

  // Lança 5 de imediato e depois um a cada 600ms
  for (let i = 0; i < 5; i++) spawnSkull();
  _skullRainInterval = setInterval(spawnSkull, 600);

function stopSkullRain() {
  if (_skullRainInterval) { clearInterval(_skullRainInterval); _skullRainInterval = null; }
  const container = document.getElementById('skull-rain');
  if (container) container.innerHTML = '';
}

function gameOver() {
  state = 'gameover';
  if (score > best) best = score;
  document.getElementById('final-score-val').textContent = (_fnT.fnFinalScore || 'SCORE') + ': ' + score;
  document.getElementById('high-score-val').textContent  = (_fnT.fnBestScore  || 'BEST')  + ': ' + best;
  // Guardar no Firebase com o nome da assinatura do utilizador
  if (score > 0) lbAddScore(score);
  showPanel('gameover');
  startSkullRain();
}

// ── UPDATE ────────────────────────────────────────────────────────
function update(dt) {
  frameSeed++;

  // Estrelas dinâmicas e shake — actualizar sempre
  updateGameStars(dt);
  updateShake(dt);

  if (state !== 'playing') {
    bladeTrail.forEach(b => b.life -= dt * 4);
    bladeTrail = bladeTrail.filter(b => b.life > 0);
    return;
  }

  // Câmara lenta removida — velocidade controlada por gravity no spawn
  // timeScale mantido apenas como variável legada (=1.0 fixo)
  timeScale = 1.0;

  // Spawn
  gameTime += dt;
  spawnTimer += dt;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnFruit();
    spawnInterval = Math.max(0.45, 2.2 - gameTime * 0.0040);
  }

  // Fruits — física por passo fixo (sem ft, sem dt) — velocidades originais preservadas
  for (let f of fruits) {
    f.x += f.vx;
    f.y += f.vy;
    f.vy += (f.gravity ?? 0.10);
    f.rot += f.spin;
  }

  // Check slice
  checkSlice();

  // Remove fruits that fell off
  const before = fruits.length;
  fruits = fruits.filter(f => {
    if (!f.sliced && f.y > H + 60) {
      missedFruit(f);
      return false;
    }
    return f.y < H + 100;
  });

  // Slices
  for (let s of slices) {
    s.x += s.vx; s.y += s.vy;
    s.vy += 0.10;
    s.rot += s.spin;
    s.life -= dt * 0.8;
  }
  slices = slices.filter(s => s.life > 0 && s.y < H + 100);

  // Particles
  for (let p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.12;
    p.life -= dt * (p.type === 'explosion' ? 1.2 : 1.4);
  }
  particles = particles.filter(p => p.life > 0);

  // Combo — timer de 1 segundo que reseta a cada corte
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) {
      combo = 0;
      comboTimer = 0;
    }
  }

  // Combo texts
  for (let ct of comboTexts) {
    ct.y += ct.vy;
    ct.life -= dt * 1.1;
  }
  comboTexts = comboTexts.filter(ct => ct.life > 0);

  // Blade
  bladeTrail.forEach(b => b.life -= dt * 5);
  bladeTrail = bladeTrail.filter(b => b.life > 0);

  // Slash trails
  for (let s of slashTrails) s.life -= dt * (s.dynamic ? 4.5 : 0.65);
  slashTrails = slashTrails.filter(s => s.life > 0);

  // Slash dust particles
  for (let p of slashParticles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.04;
    p.life -= dt * 1.1;
  }
  slashParticles = slashParticles.filter(p => p.life > 0);
}

// ── DRAW ──────────────────────────────────────────────────────────
function draw() {
  // Background — céu preto com estrelas
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#000000');
  bgGrad.addColorStop(0.5, '#02020a');
  bgGrad.addColorStop(1, '#050d03');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Estrelas dinâmicas + cometas
  drawGameStars();

  // Sliced halves
  for (let s of slices) drawSlice(s);

  // Fruits
  for (let f of fruits) if (!f.sliced) drawFruit(f);

  // Juice particles
  for (let p of particles) {
    ctx.globalAlpha = p.life * 0.9;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Combo texts
  for (let ct of comboTexts) {
    ctx.globalAlpha = Math.min(1, ct.life * 1.5);
    ctx.font = `bold ${ct.life > 0.8 ? 22 : 20}px 'Bangers', cursive`;
    ctx.fillStyle = ct.color;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 8;
    ctx.fillText(ct.text, ct.x, ct.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // Slash dust particles
  for (let p of slashParticles) {
    const pa = Math.max(0, p.life / p.maxLife) * p.opacity;
    ctx.globalAlpha = pa;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Sword slash trails — estilo carvão e poeira
  for (let s of slashTrails) {
    const alpha = Math.pow(s.life, 0.55);
    if (alpha < 0.01) continue;

    const { HALF } = s;
    const ux = Math.cos(s.ang), uy = Math.sin(s.ang);
    const nx = -uy, ny = ux;
    const ax = s.cx - ux*HALF, ay = s.cy - uy*HALF;
    const bx = s.cx + ux*HALF, by = s.cy + uy*HALF;

    ctx.save();

    // Smear strokes (carvão irregular)
    s.smears.forEach(sm => {
      const smHALF = HALF * sm.len;
      const center = sm.start + sm.len * 0.5;
      const scx2 = s.cx + ux*(center*2-1)*HALF;
      const scy2 = s.cy + uy*(center*2-1)*HALF;
      const sax = scx2 - ux*smHALF + nx*sm.offN;
      const say = scy2 - uy*smHALF + ny*sm.offN;
      const sbx = scx2 + ux*smHALF + nx*sm.offN;
      const sby = scy2 + uy*smHALF + ny*sm.offN;
      const smx = (sax+sbx)/2 + nx*sm.offT;
      const smy = (say+sby)/2 + ny*sm.offT;

      const g = ctx.createLinearGradient(sax, say, sbx, sby);
      g.addColorStop(0,   'rgba(255,255,255,0)');
      g.addColorStop(0.2, `rgba(255,255,255,${sm.ta*alpha})`);
      g.addColorStop(0.8, `rgba(255,255,255,${sm.ta*alpha})`);
      g.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(sax, say);
      ctx.quadraticCurveTo(smx + nx*sm.hw, smy + ny*sm.hw, sbx, sby);
      ctx.quadraticCurveTo(smx - nx*sm.hw, smy - ny*sm.hw, sax, say);
      ctx.closePath();
      ctx.fill();
    });

    // Dense core
    ctx.globalAlpha = alpha * 0.6;
    const cg = ctx.createLinearGradient(
      s.cx + nx*7, s.cy + ny*7,
      s.cx - nx*7, s.cy - ny*7
    );
    cg.addColorStop(0,    'rgba(255,255,255,0)');
    cg.addColorStop(0.35, 'rgba(255,255,255,0.9)');
    cg.addColorStop(0.5,  'rgba(255,255,255,1)');
    cg.addColorStop(0.65, 'rgba(255,255,255,0.9)');
    cg.addColorStop(1,    'rgba(255,255,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(s.cx + nx*7, s.cy + ny*7, bx, by);
    ctx.quadraticCurveTo(s.cx - nx*7, s.cy - ny*7, ax, ay);
    ctx.closePath();
    ctx.fill();

    // Bright spine
    const sg = ctx.createLinearGradient(ax, ay, bx, by);
    sg.addColorStop(0,    'rgba(255,255,255,0)');
    sg.addColorStop(0.08, `rgba(255,255,255,${alpha})`);
    sg.addColorStop(0.5,  `rgba(255,255,255,${alpha})`);
    sg.addColorStop(0.92, `rgba(255,255,255,${alpha})`);
    sg.addColorStop(1,    'rgba(255,255,255,0)');
    ctx.globalAlpha = 1;
    ctx.strokeStyle = sg;
    ctx.lineWidth = 1.8 * alpha;
    ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();

    ctx.restore();
  }

  // Blade trail
  drawBlade();

  // Custom cursor
  drawCursor();
}

function drawFruit(f) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.rot);

  if (f.name === 'bomb') {
    drawBombShape(0, 0, f.r);
  } else {
    drawFruitShape(0, 0, f.r, f, false, 0);
  }
  ctx.restore();
}

function drawFruitShape(x, y, r, fd, isHalf, halfSide) {
  ctx.save();
  ctx.translate(x, y);

  if (isHalf) {
    // Clip to half-circle
    ctx.save();
    ctx.beginPath();
    if (halfSide === 0) {
      ctx.arc(0, 0, r * 1.05, -Math.PI/2, Math.PI/2);
    } else {
      ctx.arc(0, 0, r * 1.05, Math.PI/2, -Math.PI/2);
    }
    ctx.closePath();
    ctx.clip();
  }

  const fn = fd.name;

  if (fn === 'watermelon') {
    if (isHalf) {
      // Flesh interior
      const fleshG = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      fleshG.addColorStop(0,   '#ff4444');
      fleshG.addColorStop(0.6, '#e82828');
      fleshG.addColorStop(1,   '#c01818');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fillStyle = fleshG; ctx.fill();
      // White rind ring
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
      ctx.strokeStyle = '#e8f0d0'; ctx.lineWidth = r * 0.13; ctx.stroke();
      // Green outer
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
      ctx.strokeStyle = '#2d8a2d'; ctx.lineWidth = r * 0.12; ctx.stroke();
      // Seeds
      ctx.fillStyle = '#1a0a00';
      const seedPositions = [[0.15,0.1],[0.38,-0.15],[0.55,0.18],[-0.12,0.32],[-0.35,0.05],[0.28,0.38]];
      for (const [sx,sy] of seedPositions) {
        ctx.save(); ctx.translate(sx*r, sy*r); ctx.rotate(Math.atan2(sy,sx));
        ctx.beginPath(); ctx.ellipse(0, 0, r*0.05, r*0.09, 0, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    } else {
      // Whole watermelon — green with dark stripes
      const g = ctx.createRadialGradient(-r*0.2,-r*0.25,r*0.05, 0,0,r);
      g.addColorStop(0,'#5abf3a'); g.addColorStop(0.5,'#2d8a2d'); g.addColorStop(1,'#1a5c18');
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      // Dark stripes
      ctx.save(); ctx.clip();
      ctx.strokeStyle='#1a5218'; ctx.lineWidth=r*0.13;
      for (let i=-2;i<=2;i++) {
        ctx.beginPath();
        ctx.moveTo(i*r*0.32, -r*1.1);
        ctx.bezierCurveTo(i*r*0.32+r*0.08, 0, i*r*0.32-r*0.08, 0, i*r*0.32*0.35, r*1.1);
        ctx.stroke();
      }
      ctx.restore();
      // Highlight
      const hg = ctx.createRadialGradient(-r*0.28,-r*0.3,0,-r*0.2,-r*0.25,r*0.45);
      hg.addColorStop(0,'rgba(255,255,255,0.35)'); hg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=hg; ctx.fill();
    }

  } else if (fn === 'orange') {
    const g = ctx.createRadialGradient(-r*0.25,-r*0.3,r*0.05, 0,0,r);
    g.addColorStop(0,'#ffaa44'); g.addColorStop(0.5,'#e87820'); g.addColorStop(1,'#c05a08');
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    if (isHalf) {
      // Segments
      const sg = ctx.createRadialGradient(0,0,0,0,0,r*0.82);
      sg.addColorStop(0,'#ffe090'); sg.addColorStop(1,'#f4a020');
      ctx.beginPath(); ctx.arc(0,0,r*0.82,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();
      ctx.strokeStyle='rgba(200,120,0,0.5)'; ctx.lineWidth=1;
      for (let i=0;i<8;i++) {
        const a=i*Math.PI/4;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r*0.82, Math.sin(a)*r*0.82); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0,0,r*0.12,0,Math.PI*2); ctx.fillStyle='#e87820'; ctx.fill();
    } else {
      // Peel texture dots
      ctx.fillStyle='rgba(180,80,0,0.18)';
      for (let i=0;i<18;i++) {
        const a=i*2.4, d=r*(0.2+i*0.036);
        ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, r*0.05, 0, Math.PI*2); ctx.fill();
      }
      // Navel
      ctx.beginPath(); ctx.arc(0,r*0.55,r*0.1,0,Math.PI*2);
      ctx.strokeStyle='rgba(160,70,0,0.5)'; ctx.lineWidth=2; ctx.stroke();
    }
    // Highlight
    const hg=ctx.createRadialGradient(-r*0.3,-r*0.3,0,-r*0.2,-r*0.25,r*0.4);
    hg.addColorStop(0,'rgba(255,255,255,0.45)'); hg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=hg; ctx.fill();

  } else if (fn === 'apple') {
    const g = ctx.createRadialGradient(-r*0.2,-r*0.25,r*0.05, 0.1*r,0.1*r,r);
    g.addColorStop(0,'#ff5555'); g.addColorStop(0.45,'#e02020'); g.addColorStop(1,'#900808');
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    if (isHalf) {
      // Flesh
      const fg=ctx.createRadialGradient(0,0,0,0,0,r*0.8);
      fg.addColorStop(0,'#fff8f0'); fg.addColorStop(1,'#f0d8c0');
      ctx.beginPath(); ctx.arc(0,0,r*0.8,0,Math.PI*2); ctx.fillStyle=fg; ctx.fill();
      // Core
      ctx.beginPath(); ctx.arc(0,0,r*0.15,0,Math.PI*2);
      ctx.fillStyle='#c8a878'; ctx.fill();
      // Seeds
      ctx.fillStyle='#3a2010';
      [[-0.28,0.1],[0.28,-0.08],[-0.08,-0.28],[0.12,0.3]].forEach(([sx,sy])=>{
        ctx.save(); ctx.translate(sx*r,sy*r); ctx.rotate(Math.atan2(sy,sx)+Math.PI/2);
        ctx.beginPath(); ctx.ellipse(0,0,r*0.04,r*0.08,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      });
    } else {
      // Stem
      ctx.strokeStyle='#5a3010'; ctx.lineWidth=r*0.1;
      ctx.beginPath(); ctx.moveTo(0,-r*0.9); ctx.bezierCurveTo(r*0.2,-r*1.3,r*0.35,-r*1.4,r*0.25,-r*1.55); ctx.stroke();
      // Leaf
      ctx.fillStyle='#2a8a20';
      ctx.beginPath(); ctx.ellipse(r*0.22,-r*1.32,r*0.22,r*0.1,-0.5,0,Math.PI*2); ctx.fill();
      // Indent top
      ctx.strokeStyle='rgba(100,0,0,0.3)'; ctx.lineWidth=r*0.08;
      ctx.beginPath(); ctx.arc(0,-r*0.88,r*0.12,Math.PI*0.9,Math.PI*2.1); ctx.stroke();
    }
    const hg=ctx.createRadialGradient(-r*0.25,-r*0.32,0,-r*0.18,-r*0.22,r*0.38);
    hg.addColorStop(0,'rgba(255,255,255,0.5)'); hg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=hg; ctx.fill();

  } else if (fn === 'lemon') {
    // Limão oval gordo — quase sem pontas, como na imagem real
    // Usa ellipse em vez de bezier complicado
    const lw = r * 1.15, lh = r * 0.85;
    function lemonPath() {
      ctx.beginPath();
      ctx.ellipse(0, 0, lw, lh, 0, 0, Math.PI*2);
    }
    // Cor: amarelo vivo com gradiente
    const g = ctx.createRadialGradient(-lw*0.25, -lh*0.3, r*0.05, lw*0.1, lh*0.1, lw);
    g.addColorStop(0, '#ffff60');
    g.addColorStop(0.35, '#f0e020');
    g.addColorStop(0.75, '#d4b800');
    g.addColorStop(1, '#a08800');
    lemonPath(); ctx.fillStyle = g; ctx.fill();

    if (isHalf) {
      // Interior — segmentos como limão cortado ao meio
      const fg = ctx.createRadialGradient(0,0,0,0,0,lw*0.78);
      fg.addColorStop(0,'#fffff0'); fg.addColorStop(0.8,'#f8f060'); fg.addColorStop(1,'#d4c010');
      ctx.beginPath(); ctx.ellipse(0,0,lw*0.78,lh*0.78,0,0,Math.PI*2); ctx.fillStyle=fg; ctx.fill();
      ctx.strokeStyle='rgba(190,160,0,0.45)'; ctx.lineWidth=1.2;
      for (let i=0;i<10;i++){
        const a=i*Math.PI*2/10;
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a)*lw*0.78, Math.sin(a)*lh*0.78);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0,0,r*0.11,0,Math.PI*2); ctx.fillStyle='#d4c010'; ctx.fill();
    } else {
      // Textura da casca — pontinhos irregulares
      ctx.save();
      lemonPath(); ctx.clip();
      ctx.fillStyle='rgba(160,130,0,0.12)';
      for (let i=0;i<28;i++){
        const a=i*1.9, d=r*(0.12+i*0.038);
        if(d > lw*0.92) continue;
        ctx.beginPath(); ctx.arc(Math.cos(a)*d*0.95, Math.sin(a)*d*0.82, r*0.048, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
      // Pequeno umbigo nas extremidades (muito subtil)
      ctx.fillStyle='rgba(150,110,0,0.4)';
      ctx.beginPath(); ctx.ellipse( lw*0.97, 0, r*0.06, r*0.05, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-lw*0.97, 0, r*0.06, r*0.05, 0, 0, Math.PI*2); ctx.fill();
    }
    // Highlight brilhante no topo esquerdo
    const hg = ctx.createRadialGradient(-lw*0.32, -lh*0.35, 0, -lw*0.18, -lh*0.20, lw*0.48);
    hg.addColorStop(0,'rgba(255,255,220,0.65)'); hg.addColorStop(0.5,'rgba(255,255,180,0.25)'); hg.addColorStop(1,'rgba(255,255,150,0)');
    lemonPath(); ctx.fillStyle=hg; ctx.fill();
    // Outline suave para a forma oval
    lemonPath(); ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=2; ctx.stroke();

  } else if (fn === 'peach') {
    const g=ctx.createRadialGradient(-r*0.15,-r*0.2,r*0.05,0.1*r,0.1*r,r);
    g.addColorStop(0,'#ffcc88'); g.addColorStop(0.4,'#f08040'); g.addColorStop(1,'#c04820');
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    // Blush
    ctx.fillStyle='rgba(255,80,80,0.18)';
    ctx.beginPath(); ctx.ellipse(r*0.22,r*0.1,r*0.38,r*0.32,0.3,0,Math.PI*2); ctx.fill();
    if (isHalf) {
      const fg=ctx.createRadialGradient(0,0,0,0,0,r*0.8);
      fg.addColorStop(0,'#ffe8c0'); fg.addColorStop(1,'#f8c080');
      ctx.beginPath(); ctx.arc(0,0,r*0.8,0,Math.PI*2); ctx.fillStyle=fg; ctx.fill();
      // Pit
      ctx.beginPath(); ctx.ellipse(0,r*0.1,r*0.22,r*0.28,0,0,Math.PI*2);
      ctx.fillStyle='#8B4513'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,r*0.1,r*0.16,r*0.2,0,0,Math.PI*2);
      ctx.fillStyle='#6B3010'; ctx.fill();
    } else {
      // Stem
      ctx.strokeStyle='#5a3010'; ctx.lineWidth=r*0.08;
      ctx.beginPath(); ctx.moveTo(0,-r*0.88); ctx.lineTo(r*0.05,-r*1.18); ctx.stroke();
    }
    const hg=ctx.createRadialGradient(-r*0.28,-r*0.3,0,-r*0.2,-r*0.22,r*0.38);
    hg.addColorStop(0,'rgba(255,255,255,0.42)'); hg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=hg; ctx.fill();

  } else if (fn === 'grape') {
    // Draw as a cluster of small spheres
    if (!isHalf) {
      const positions = [[0,-r*0.55],[r*0.38,-r*0.28],[r*0.55,r*0.12],[r*0.25,r*0.52],[-r*0.25,r*0.52],[-r*0.55,r*0.12],[-r*0.38,-r*0.28],[0,r*0.1]];
      for (const [gx,gy] of positions) {
        const gg=ctx.createRadialGradient(gx-r*0.12,gy-r*0.12,r*0.03,gx,gy,r*0.32);
        gg.addColorStop(0,'#cc80ff'); gg.addColorStop(0.5,'#8020c0'); gg.addColorStop(1,'#4a0880');
        ctx.beginPath(); ctx.arc(gx,gy,r*0.32,0,Math.PI*2); ctx.fillStyle=gg; ctx.fill();
        const gh=ctx.createRadialGradient(gx-r*0.1,gy-r*0.1,0,gx-r*0.08,gy-r*0.08,r*0.16);
        gh.addColorStop(0,'rgba(255,255,255,0.45)'); gh.addColorStop(1,'rgba(255,255,255,0)');
        ctx.beginPath(); ctx.arc(gx,gy,r*0.32,0,Math.PI*2); ctx.fillStyle=gh; ctx.fill();
      }
      // Stem
      ctx.strokeStyle='#5a3a10'; ctx.lineWidth=r*0.09;
      ctx.beginPath(); ctx.moveTo(0,-r*0.85); ctx.bezierCurveTo(r*0.18,-r*1.1,r*0.28,-r*1.2,r*0.22,-r*1.38); ctx.stroke();
    } else {
      // Sliced grape — show 3-4 individual grape spheres scattered, cut open
      const halfPositions = halfSide === 0
        ? [[r*0.18,-r*0.32],[r*0.42,r*0.1],[-r*0.1,r*0.3],[r*0.05,-r*0.05]]
        : [[-r*0.18,-r*0.32],[-r*0.42,r*0.1],[r*0.1,r*0.3],[-r*0.05,-r*0.05]];
      for (const [gx,gy] of halfPositions) {
        // Outer skin
        const gg=ctx.createRadialGradient(gx-r*0.1,gy-r*0.1,r*0.02,gx,gy,r*0.28);
        gg.addColorStop(0,'#cc80ff'); gg.addColorStop(0.5,'#8020c0'); gg.addColorStop(1,'#4a0880');
        ctx.beginPath(); ctx.arc(gx,gy,r*0.28,0,Math.PI*2); ctx.fillStyle=gg; ctx.fill();
        // Exposed juicy flesh in the centre of each sphere (cut face)
        const fg=ctx.createRadialGradient(gx,gy,0,gx,gy,r*0.18);
        fg.addColorStop(0,'#e8b0ff'); fg.addColorStop(1,'#b060e0');
        ctx.beginPath(); ctx.arc(gx,gy,r*0.18,0,Math.PI*2); ctx.fillStyle=fg; ctx.fill();
        // Highlight
        const gh=ctx.createRadialGradient(gx-r*0.08,gy-r*0.08,0,gx-r*0.06,gy-r*0.06,r*0.13);
        gh.addColorStop(0,'rgba(255,255,255,0.5)'); gh.addColorStop(1,'rgba(255,255,255,0)');
        ctx.beginPath(); ctx.arc(gx,gy,r*0.28,0,Math.PI*2); ctx.fillStyle=gh; ctx.fill();
      }
    }

  } else if (fn === 'pineapple') {
    if (!isHalf) {
      // Body
      const g=ctx.createRadialGradient(-r*0.15,-r*0.2,r*0.05,0,0,r);
      g.addColorStop(0,'#ffe060'); g.addColorStop(0.5,'#c89020'); g.addColorStop(1,'#8a6010');
      ctx.beginPath(); ctx.ellipse(0,r*0.1,r*0.82,r,0,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      // Scale pattern
      ctx.strokeStyle='rgba(120,80,0,0.4)'; ctx.lineWidth=1.2;
      for (let row=-3;row<=3;row++) {
        for (let col=-3;col<=3;col++) {
          const px=col*r*0.28+(row%2)*r*0.14, py=row*r*0.26+r*0.1;
          if (px*px/(r*0.82*r*0.82)+py*py/(r*r)>0.75) continue;
          ctx.beginPath(); ctx.arc(px,py,r*0.12,0,Math.PI*2); ctx.stroke();
          ctx.fillStyle='rgba(140,90,0,0.12)'; ctx.fill();
        }
      }
      // Crown leaves
      const leafColors=['#2a8a20','#1e6e18','#358c28'];
      [[-r*0.32,-r*1.05,-0.7],[-r*0.12,-r*1.25,-0.2],[r*0.12,-r*1.25,0.2],[r*0.32,-r*1.05,0.7],[0,-r*1.35,0]].forEach(([lx,ly,la],i)=>{
        ctx.fillStyle=leafColors[i%3];
        ctx.beginPath(); ctx.ellipse(lx,ly,r*0.1,r*0.32,la,0,Math.PI*2); ctx.fill();
      });
    } else {
      const g=ctx.createRadialGradient(0,0,0,0,0,r);
      g.addColorStop(0,'#fff8a0'); g.addColorStop(0.5,'#f0d040'); g.addColorStop(1,'#c09820');
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      ctx.strokeStyle='rgba(160,110,0,0.35)'; ctx.lineWidth=r*0.04;
      for (let row=-3;row<=3;row++) {
        for (let col=-3;col<=3;col++) {
          const px=col*r*0.28+(row%2)*r*0.14, py=row*r*0.26;
          if (px*px+py*py > r*r*0.85) continue;
          ctx.beginPath(); ctx.rect(px-r*0.1,py-r*0.1,r*0.2,r*0.2); ctx.stroke();
        }
      }
      ctx.beginPath(); ctx.arc(0,0,r*0.12,0,Math.PI*2); ctx.fillStyle='#a07010'; ctx.fill();
    }
    const hg=ctx.createRadialGradient(-r*0.3,-r*0.35,0,-r*0.2,-r*0.25,r*0.4);
    hg.addColorStop(0,'rgba(255,255,255,0.38)'); hg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=hg; ctx.fill();

  } else if (fn === 'strawberry') {
    if (!isHalf) {
      // Heart-ish shape
      ctx.save();
      ctx.scale(0.9,1.05);
      const g=ctx.createRadialGradient(-r*0.15,-r*0.15,r*0.05,0,0,r);
      g.addColorStop(0,'#ff6070'); g.addColorStop(0.5,'#e02040'); g.addColorStop(1,'#900820');
      ctx.beginPath();
      ctx.moveTo(0,r*0.9);
      ctx.bezierCurveTo(-r*1.0,r*0.3,-r*1.05,-r*0.4,-r*0.5,-r*0.55);
      ctx.bezierCurveTo(-r*0.1,-r*0.75,0,-r*0.55,0,-r*0.4);
      ctx.bezierCurveTo(0,-r*0.55,r*0.1,-r*0.75,r*0.5,-r*0.55);
      ctx.bezierCurveTo(r*1.05,-r*0.4,r*1.0,r*0.3,0,r*0.9);
      ctx.fillStyle=g; ctx.fill();
      ctx.restore();
      // Seeds (tiny yellow dots)
      ctx.fillStyle='#ffe060';
      for (let i=0;i<12;i++){const a=i*0.88+0.3,d=r*(0.2+i*0.052);if(d>r*0.85)continue;ctx.beginPath();ctx.arc(Math.cos(a)*d*0.8,Math.sin(a)*d-r*0.05,r*0.04,0,Math.PI*2);ctx.fill();}
      // Leaves

      hg.addColorStop(0,'rgba(255,200,200,0.52)'); hg.addColorStop(1,'rgba(255,160,160,0)');
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=hg; ctx.fill();
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=2; ctx.stroke();
    } else {

      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle='#b81818'; ctx.fill();
      // Inner rind — cream/yellow

      ctx.beginPath(); ctx.arc(0,0,r*0.96,0,Math.PI*2); ctx.fillStyle=rindG; ctx.fill();

      ctx.beginPath(); ctx.arc(0,0,r*0.80,0,Math.PI*2); ctx.fillStyle='#fff5e0'; ctx.fill();
      // Seeds — packed ruby-red arils
      for (let row=-3;row<=3;row++) {
        for (let col=-3;col<=3;col++) {

          if (sx*sx+sy*sy>r*r*0.56) continue;

      });

      ctx.fillStyle='#1a0a02'; ctx.beginPath(); ctx.arc(0,-r*0.88,r*0.07,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=2; ctx.stroke();

    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);

}

function drawSlice(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  ctx.globalAlpha = Math.min(1, s.life);

  const fd = s.fd;
  if (fd.name === 'bomb') {
    ctx.restore(); return;
  }

  // Draw half fruit
  const ang = s.sliceAng - s.rot;
  ctx.rotate(ang);
  drawFruitShape(0, 0, fd.r, fd, true, s.half === 'left' ? 0 : 1);

  ctx.restore();
}

function drawBombShape(x, y, r) {
  // Body
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = '#1a1a1a';
  ctx.fill();
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Shine
  ctx.beginPath();
  ctx.arc(x - r*0.25, y - r*0.28, r*0.18, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();

  // Fuse
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.bezierCurveTo(x+r*0.5, y-r*1.3, x+r*0.2, y-r*1.6, x+r*0.4, y-r*1.9);
  ctx.stroke();

  // Fuse spark
  ctx.beginPath();
  ctx.arc(x + r*0.4, y - r*1.9, 4, 0, Math.PI*2);
  ctx.fillStyle = '#ffcc00';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + r*0.4, y - r*1.9, 3, 0, Math.PI*2);
  ctx.fillStyle = '#ff8800';
  ctx.fill();

  // Skull
  ctx.fillStyle = '#fff';
  ctx.font = `${r*0.8}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💀', x, y + 2);
  ctx.textBaseline = 'alphabetic';
}

function drawBlade() {
  if (bladeTrail.length < 2) return;

  // Outer glow
  for (let i = 1; i < bladeTrail.length; i++) {
    const a = bladeTrail[i-1], b = bladeTrail[i];
    const t = i / bladeTrail.length;
    const alpha = t * b.life * 0.5;
    const width = t * 20;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.35})`;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.filter = 'blur(3px)';
    ctx.stroke();
    ctx.filter = 'none';
  }

  // Core bright trail
  for (let i = 1; i < bladeTrail.length; i++) {
    const a = bladeTrail[i-1], b = bladeTrail[i];
    const t = i / bladeTrail.length;
    const alpha = t * b.life * 0.95;
    const width = t * 8;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Bright blue-white core
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(200,240,255,${alpha * 0.8})`;
    ctx.lineWidth = width * 0.35;
    ctx.stroke();
  }
}

function drawCursor() {
  if (state !== 'playing') return;
  ctx.save();
  ctx.translate(mouseX, mouseY);

  if (isSlicing) {
    // Crosshair contraído + círculo laranja quando está a cortar
    ctx.strokeStyle = 'rgba(255,200,80,0.95)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
    ctx.moveTo(0, -6); ctx.lineTo(0, 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,1)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  } else {
    // Crosshair normal quando está a pairar
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
    ctx.moveTo(0, -12); ctx.lineTo(0, 12);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,200,100,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

// Aplica-se em TODOS os estados: menu, jogo, pausa, game-over
(function () {
  const wrap = document.getElementById('wrap');
  const MAX_TILT   = 4;     // graus máximos
  const LERP_SPEED = 0.07;  // suavidade (0=estático, 1=imediato)

  let targetRX = 0, targetRY = 0;
  let currentRX = 0, currentRY = 0;

  // Escuta mousemove no wrap inteiro (inclui overlays de menu/pausa)
  wrap.addEventListener('mousemove', (e) => {
    const r = wrap.getBoundingClientRect();
    const nx = ((e.clientX - r.left)  / r.width  - 0.5) * 2;
    const ny = ((e.clientY - r.top)   / r.height - 0.5) * 2;
    targetRY =  nx * MAX_TILT;
    targetRX = -ny * MAX_TILT;
  });
  wrap.addEventListener('mouseleave', () => {
    targetRX = 0;
    targetRY = 0;
  });

  (function tick() {
    currentRX += (targetRX - currentRX) * LERP_SPEED;
    currentRY += (targetRY - currentRY) * LERP_SPEED;
    applyWrapTransform(currentRX, currentRY);
    requestAnimationFrame(tick);
  })();
})();

// ── LOOP ──────────────────────────────────────────────────────────
const FIXED_STEP = 1 / 120; // física a 120Hz fixo — igual ao monitor
let accumulator = 0;

function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.1); // cap 100ms para evitar espiral
  lastTime = ts;

  accumulator += dt;

  // Correr tantos passos físicos quantos necessários para cobrir o tempo acumulado
  while (accumulator >= FIXED_STEP) {
    update(FIXED_STEP);
    accumulator -= FIXED_STEP;
  }

  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
startFruitRain();

// Aplica as cores directamente no #wrap (inline style) E nas CSS vars.

let _temaRecebido = false;

function _aplicarTema(borda, sombra) {
    // 1. CSS vars — para tudo o resto que as use
    document.documentElement.style.setProperty('--cor-borda-principal', borda);
    document.documentElement.style.setProperty('--cor-sombra', sombra);
    // 2. Inline directo no #wrap — garante repaint imediato na borda
    var wrap = document.getElementById('wrap');
    if (wrap) {
        wrap.style.outline   = '2px solid ' + borda;
        wrap.style.boxShadow = '6px 6px 0 ' + sombra;
    }
    _temaRecebido = true;
}

window.addEventListener('message', function (event) {
    if (event.data && event.data.tipo === 'MUDAR_TEMA') {
        _aplicarTema(event.data.borda, event.data.sombra);

    if (event.data && event.data.tipo === 'FN_SET_LANG') {

// Retry loop — pede o tema ao pai a cada 50ms até receber resposta.
// Não depende de timing: continua a tentar até o pai responder.
(function pedirTemaComRetry() {
    if (!window.parent || window.parent === window) return;
    var _retryInterval = setInterval(function () {
        if (_temaRecebido) { clearInterval(_retryInterval); return; }
        window.parent.postMessage({ tipo: 'PEDIR_TEMA' }, '*');
    }, 50);
    setTimeout(function () { clearInterval(_retryInterval); }, 3000);
})();

// Retry loop — pede a lang ao pai até receber FN_SET_LANG com conteúdo.
(function pedirLangComRetry() {
    if (!window.parent || window.parent === window) return;
    var _langRecebida = false;
    var _langInterval = setInterval(function () {
        if (_langRecebida) { clearInterval(_langInterval); return; }
        window.parent.postMessage({ tipo: 'PEDIR_TEMA' }, '*'); // reutiliza PEDIR_TEMA que já envia a lang
    }, 80);
    setTimeout(function () { clearInterval(_langInterval); }, 4000);
    // Marca como recebida quando fnApplyLang for chamada com dados reais
    var _origApply = fnApplyLang;
    fnApplyLang = function(t) {
        if (t && t.fnPlay && t.fnPlay !== 'fnPlay') _langRecebida = true;
        _origApply(t);

})();
