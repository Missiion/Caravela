    bgCtx.globalAlpha=0.06;
    [[mx+10,my+6,7],[mx-12,my-10,4.5],[mx+4,my-16,3.5]].forEach(([cx,cy,r])=>{ bgCtx.beginPath(); bgCtx.arc(cx,cy,r,0,Math.PI*2); bgCtx.fillStyle='#7a6040'; bgCtx.fill(); });
    bgCtx.globalAlpha=1;
  }

  const BAMBOO_DEFS = [
    {x:12, segs:15,thick:11,lean: 0.007,side:'left'},  {x:38, segs:12,thick:7,lean:-0.005,side:'left'},
    {x:58, segs:9, thick:5, lean: 0.009,side:'left'},  {x:500,segs:14,thick:10,lean:-0.008,side:'right'},
    {x:520,segs:11,thick:7, lean: 0.006,side:'right'}, {x:534,segs:8, thick:4, lean:-0.004,side:'right'},
  ];
  function drawBamboo(b, t) {
    const segH=52, sway=windSway(b.x,t*0.5,1.0), totalSway=sway*b.segs*0.5;
    let px=b.x, py=BH-60;
    bgCtx.lineCap='round';
    for (let i=0;i<b.segs;i++) {
      const progress=i/b.segs, bendX=totalSway*progress*progress;
      const nx=px+bendX*0.12+b.lean*segH, ny=py-segH, alpha=0.6-progress*0.08;
      bgCtx.save(); bgCtx.globalAlpha=alpha; bgCtx.strokeStyle=i%2===0?'#1c2e0c':'#243614';
      bgCtx.lineWidth=b.thick-i*0.3; bgCtx.shadowColor='rgba(0,0,0,0.5)'; bgCtx.shadowBlur=3;
      bgCtx.beginPath(); bgCtx.moveTo(px,py); bgCtx.lineTo(nx,ny); bgCtx.stroke();
      bgCtx.strokeStyle='#0e1c06'; bgCtx.lineWidth=b.thick-i*0.3+2.5; bgCtx.shadowBlur=0;
      bgCtx.beginPath(); bgCtx.moveTo(nx-2,ny+3); bgCtx.lineTo(nx+2,ny+3); bgCtx.stroke(); bgCtx.restore();
      if (i>=b.segs-6) {
        const leafCount=1+(i>b.segs-3?1:0);
        for (let l=0;l<leafCount;l++) {
          const dir=(l%2===0?1:-1)*(b.side==='left'?1:-1), leafSway=windSway(b.x+i*10,t*0.7,1.4)*18;
          bgCtx.save(); bgCtx.globalAlpha=alpha*0.8; bgCtx.strokeStyle='#2a4412'; bgCtx.lineWidth=1.8; bgCtx.lineCap='round';
          bgCtx.translate(nx,ny); bgCtx.rotate(leafSway*0.04);
          bgCtx.beginPath(); bgCtx.moveTo(0,0);
          bgCtx.bezierCurveTo(dir*22,-8+leafSway*0.3,dir*38,-4+leafSway*0.2,dir*44,-16+leafSway*0.5);
          bgCtx.stroke(); bgCtx.restore();
        }
      }
      px=nx; py=ny;
    }
  }

  const grassBlades = [];
  function initGrass() {
    for (let i=0;i<280;i++) {
      const x=Math.random()*BW;
      const hBase=28+Math.random()*42;
      grassBlades.push({x,baseY:BH-15+Math.random()*28,h:hBase,thick:0.6+Math.random()*1.2,
        phase:Math.random()*Math.PI*2,speed:0.5+Math.random()*0.9,
        color:Math.random()<0.5?'#1a3208':'#223a0a',alpha:0.55+Math.random()*0.25});
    }
    // Extra blades to guarantee right-side coverage
    for (let i=0;i<40;i++) {
      const x=BW*0.75 + Math.random()*BW*0.25;
      const hBase=28+Math.random()*42;
      grassBlades.push({x,baseY:BH-15+Math.random()*28,h:hBase,thick:0.6+Math.random()*1.2,
        phase:Math.random()*Math.PI*2,speed:0.5+Math.random()*0.9,
        color:Math.random()<0.5?'#1a3208':'#223a0a',alpha:0.55+Math.random()*0.25});
    }
  }
  function drawGrass(t) {
    bgCtx.lineCap='round';
    grassBlades.forEach(g => {
      const sway=windSway(g.x,t*g.speed+g.phase,1.2)*14, tipX=g.x+sway, tipY=g.baseY-g.h;
      bgCtx.save(); bgCtx.globalAlpha=g.alpha; bgCtx.strokeStyle=g.color; bgCtx.lineWidth=g.thick;
      bgCtx.beginPath(); bgCtx.moveTo(g.x,g.baseY);
      bgCtx.quadraticCurveTo(g.x+sway*0.5,g.baseY-g.h*0.55,tipX,tipY);
      bgCtx.stroke(); bgCtx.restore();
    });
  }

  const stars = Array.from({length:55},()=>({x:Math.random()*BW,y:Math.random()*BH*0.65,r:0.4+Math.random()*1.1,twinkle:Math.random()*Math.PI*2,speed:0.5+Math.random()*1.2}));
  function drawStars(t) {
    stars.forEach(s => {
      const a=0.3+0.5*(0.5+0.5*Math.sin(s.twinkle+t*s.speed));
      bgCtx.save(); bgCtx.globalAlpha=a; bgCtx.fillStyle='rgba(230,225,210,1)';
      bgCtx.beginPath(); bgCtx.arc(s.x,s.y,s.r,0,Math.PI*2); bgCtx.fill(); bgCtx.restore();
    });
  }

  function drawSky() {
    const sky=bgCtx.createLinearGradient(0,0,0,BH);
    sky.addColorStop(0,'#000000'); sky.addColorStop(0.5,'#02020a'); sky.addColorStop(1,'#050d03');
    bgCtx.fillStyle=sky; bgCtx.fillRect(0,0,BW,BH);
  }
  function drawGround() {
    const g=bgCtx.createLinearGradient(0,BH-55,0,BH);
    g.addColorStop(0,'rgba(8,16,4,0)'); g.addColorStop(1,'rgba(6,12,3,0.9)');
    bgCtx.fillStyle=g; bgCtx.fillRect(0,BH-55,BW,55);
  }

  initGrass();
  let bgLast=0, bgRaf=null;
  function bgTick(ts) {
    const dt=Math.min((ts-bgLast)/1000,0.05); bgLast=ts;
    const t=ts/1000;
    updateWind(dt); updateSweep(dt);
    bgCtx.clearRect(0,0,BW,BH);
    drawSky(); drawStars(t); drawSweepBeam(); drawMoon();
    BAMBOO_DEFS.forEach(b=>drawBamboo(b,t)); drawGrass(t); drawGround();
    bgRaf = requestAnimationFrame(bgTick);
  }

  // Só animar quando o menu está visível
  const menuPanel = document.getElementById('panelMenu');
  const menuObserver = new MutationObserver(() => {
    const hidden = menuPanel.classList.contains('hidden');
    if (!hidden && !bgRaf) {
      bgRaf = requestAnimationFrame(ts => { bgLast=ts; bgRaf=requestAnimationFrame(bgTick); });
    } else if (hidden && bgRaf) {
      cancelAnimationFrame(bgRaf); bgRaf=null;
    }
  });
  menuObserver.observe(menuPanel, {attributes:true, attributeFilter:['class']});
  // Arrancar imediatamente se o menu já estiver visível
  if (!menuPanel.classList.contains('hidden')) {
    bgRaf = requestAnimationFrame(ts => { bgLast=ts; bgRaf=requestAnimationFrame(bgTick); });
  }
})();


// ── DEAD FOREST GAME OVER BACKGROUND ─────────────────────────
(function() {
  const bgCanvas = document.getElementById('gameoverBgCanvas');
  if (!bgCanvas) return;
  const bgCtx = bgCanvas.getContext('2d');
  const BW=540, BH=700;

  // WIND
  let windPhase=0, windStrength=0, windTarget=0, windTimer=0;
  function updateWind(dt) {
    windTimer-=dt;
    if(windTimer<=0){windTarget=(Math.random()-0.5)*0.025;windTimer=4+Math.random()*6;}
    windStrength+=(windTarget-windStrength)*dt*0.3;
    windPhase+=dt*(0.25+Math.abs(windStrength)*5);
  }

  // STARS + MOON
  const goStars=Array.from({length:55},()=>({x:Math.random()*BW,y:Math.random()*BH*0.65,r:0.4+Math.random()*1.1,tw:Math.random()*Math.PI*2,sp:0.5+Math.random()*1.2}));
  function drawSky(){const s=bgCtx.createLinearGradient(0,0,0,BH);s.addColorStop(0,'#000');s.addColorStop(0.5,'#05000a');s.addColorStop(1,'#0a0205');bgCtx.fillStyle=s;bgCtx.fillRect(0,0,BW,BH);}
  function drawStars(t){goStars.forEach(s=>{const a=0.25+0.45*(0.5+0.5*Math.sin(s.tw+t*s.sp));bgCtx.save();bgCtx.globalAlpha=a;bgCtx.fillStyle='rgba(210,195,220,1)';bgCtx.beginPath();bgCtx.arc(s.x,s.y,s.r,0,Math.PI*2);bgCtx.fill();bgCtx.restore();});}
  function drawMoon(){
    const mx=400,my=80,mr=38;
    const halo=bgCtx.createRadialGradient(mx,my,mr*0.8,mx,my,mr*3.8);
    halo.addColorStop(0,'rgba(180,80,80,0.14)');halo.addColorStop(1,'rgba(0,0,0,0)');
    bgCtx.fillStyle=halo;bgCtx.beginPath();bgCtx.arc(mx,my,mr*3.8,0,Math.PI*2);bgCtx.fill();
    const body=bgCtx.createRadialGradient(mx-7,my-7,3,mx,my,mr);
    body.addColorStop(0,'rgba(240,220,210,0.92)');body.addColorStop(0.6,'rgba(210,180,165,0.84)');body.addColorStop(1,'rgba(160,120,110,0.68)');
    bgCtx.fillStyle=body;bgCtx.shadowColor='rgba(180,80,60,0.35)';bgCtx.shadowBlur=18;
    bgCtx.beginPath();bgCtx.arc(mx,my,mr,0,Math.PI*2);bgCtx.fill();bgCtx.shadowBlur=0;
    bgCtx.globalAlpha=0.07;[[mx+9,my+5,6],[mx-10,my-8,4],[mx+3,my-13,3]].forEach(([cx,cy,r])=>{bgCtx.beginPath();bgCtx.arc(cx,cy,r,0,Math.PI*2);bgCtx.fillStyle='#5a2020';bgCtx.fill();});
    bgCtx.globalAlpha=1;
  }

  // ÁRVORES REMOVIDAS

  // NÉVOA — densa e visível
  const fogLayers=[
    {x:-60,y:BH-55,w:280,h:70,spd:0.006,dir:1,a:0.28},
    {x:180,y:BH-80,w:260,h:80,spd:0.009,dir:-1,a:0.22},
    {x:380,y:BH-45,w:220,h:60,spd:0.007,dir:1,a:0.25},
    {x:80, y:BH-115,w:300,h:65,spd:0.005,dir:-1,a:0.18},
    {x:320,y:BH-130,w:240,h:55,spd:0.008,dir:1,a:0.16},
  ];
  function drawFog(t){
    // Base densa
    bgCtx.save();
    const base=bgCtx.createLinearGradient(0,BH-170,0,BH);
    base.addColorStop(0,'rgba(40,40,40,0)');base.addColorStop(0.3,'rgba(55,55,55,0.35)');
    base.addColorStop(0.65,'rgba(65,65,65,0.60)');base.addColorStop(1,'rgba(45,45,45,0.80)');
    bgCtx.fillStyle=base;bgCtx.fillRect(0,BH-170,BW,170);bgCtx.restore();
    // Volutes
    fogLayers.forEach((f,i)=>{
      f.x+=f.spd*f.dir*(1+windStrength*12);
      if(f.x>BW+f.w)f.x=-f.w*1.5;if(f.x<-f.w*1.5)f.x=BW+f.w;
      const a=f.a+Math.sin(t*0.35+i*1.3)*0.04;
      bgCtx.save();bgCtx.globalAlpha=a;
      const g=bgCtx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.w*0.65);
      g.addColorStop(0,'rgba(200,200,200,1)');g.addColorStop(0.45,'rgba(170,170,170,0.6)');g.addColorStop(1,'rgba(120,120,120,0)');
      bgCtx.fillStyle=g;bgCtx.beginPath();bgCtx.ellipse(f.x,f.y,f.w,f.h,0,0,Math.PI*2);bgCtx.fill();bgCtx.restore();
    });
  }
  function drawGround(){const g=bgCtx.createLinearGradient(0,BH-50,0,BH);g.addColorStop(0,'rgba(4,2,6,0)');g.addColorStop(1,'rgba(3,1,5,0.95)');bgCtx.fillStyle=g;bgCtx.fillRect(0,BH-50,BW,50);}

  let goLast=0, goRaf=null;
  function goTick(ts){
    const dt=Math.min((ts-goLast)/1000,0.05);goLast=ts;const t=ts/1000;
    updateWind(dt);bgCtx.clearRect(0,0,BW,BH);
    drawSky();drawStars(t);drawMoon();drawFog(t);drawGround();
    goRaf=requestAnimationFrame(goTick);
  }
  const goPanel=document.getElementById('panelGameOver');
  new MutationObserver(()=>{
    const hidden=goPanel.classList.contains('hidden');
    if(!hidden&&!goRaf){goRaf=requestAnimationFrame(ts=>{goLast=ts;goRaf=requestAnimationFrame(goTick);});}
    else if(hidden&&goRaf){cancelAnimationFrame(goRaf);goRaf=null;}
  }).observe(goPanel,{attributes:true,attributeFilter:['class']});
})();

// ── LEADERBOARD BACKGROUND ───────────────────────────────────────────────────
(function () {
  const cv  = document.getElementById('lbBgCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = 540, H = 700;

  // ── vento ─────────────────────────────────────────────────────────────────
  let wPhase = 0, wStr = 0, wTarget = 0, wTimer = 0;
  function tickWind(dt) {
    wTimer -= dt;
    if (wTimer <= 0) { wTarget = (Math.random()-0.5)*0.05; wTimer = 3+Math.random()*5; }
    wStr   += (wTarget - wStr) * dt * 0.7;
    wPhase += dt * (0.5 + Math.abs(wStr) * 6);
  }

  // ── névoa — 6 elipses suaves que se movem lentamente ─────────────────────
  const fog = [
    {x: -60, y:H-75,  w:230, h:52, spd:0.0035, dir: 1, a:0.055},
    {x: 180, y:H-95,  w:210, h:58, spd:0.0055, dir:-1, a:0.045},
    {x: 390, y:H-65,  w:200, h:48, spd:0.004,  dir: 1, a:0.055},
    {x:  60, y:H-125, w:250, h:48, spd:0.003,  dir:-1, a:0.040},
    {x: 300, y:H-110, w:220, h:44, spd:0.006,  dir: 1, a:0.040},
    {x: 460, y:H-85,  w:180, h:42, spd:0.0045, dir:-1, a:0.035},
  ];
  function drawFog(t) {
    // camada base junto ao chão
    const base = ctx.createLinearGradient(0, H-160, 0, H);
    base.addColorStop(0,   'rgba(20,20,20,0)');
    base.addColorStop(0.5, 'rgba(38,38,38,0.10)');
    base.addColorStop(1,   'rgba(28,28,28,0.20)');
    ctx.fillStyle = base;
    ctx.fillRect(0, H-160, W, 160);
    // volutes
    fog.forEach((f, i) => {
      f.x += f.spd * f.dir * (1 + wStr * 8);
      if (f.x >  W + f.w) f.x = -f.w * 1.5;
      if (f.x < -f.w * 1.5) f.x = W + f.w;
      const a = f.a + Math.sin(t * 0.25 + i * 1.3) * 0.015;
      ctx.save(); ctx.globalAlpha = a;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.w * 0.6);
      g.addColorStop(0,   'rgba(160,160,160,1)');
      g.addColorStop(0.5, 'rgba(130,130,130,0.5)');
      g.addColorStop(1,   'rgba(90,90,90,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(f.x, f.y, f.w, f.h, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });
  }

  // ── efeito de luz (cone do centro-topo, desce em fade) ────────────────────
  function drawLight() {
    const cx = W / 2;
    // Halo suave no topo — luz fria de lua
    const top = ctx.createRadialGradient(cx, -20, 0, cx, -20, W * 1.1);
    top.addColorStop(0,    'rgba(180,200,255,0.22)');
    top.addColorStop(0.25, 'rgba(140,165,230,0.10)');
    top.addColorStop(0.55, 'rgba(100,130,200,0.04)');
    top.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = top;
    ctx.fillRect(0, 0, W, H);
    // Cone de luz que desce até ao chão
    const cone = ctx.createLinearGradient(0, 0, 0, H);
    cone.addColorStop(0,   'rgba(160,185,255,0.13)');
    cone.addColorStop(0.35,'rgba(120,150,220,0.06)');
    cone.addColorStop(0.7, 'rgba(80,110,180,0.02)');
    cone.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = cone;
    ctx.fillRect(0, 0, W, H);
    // Reflexo suave no chão
    const ground = ctx.createLinearGradient(0, H*0.80, 0, H);
    ground.addColorStop(0,  'rgba(100,140,200,0)');
    ground.addColorStop(0.5,'rgba(80,120,180,0.06)');
    ground.addColorStop(1,  'rgba(60,100,160,0.12)');
    ctx.fillStyle = ground;
    ctx.fillRect(0, H*0.80, W, H*0.20);
  }

  // ── pirilampos ────────────────────────────────────────────────────────────
  const flies = [];
  let ffTimer = 0;

  function spawnFF() {
    // aparecem em qualquer zona, ligeiramente evitando o centro da lista
    const zones = [
      () => ({ x: Math.random()*W*0.25,            y: H*0.15 + Math.random()*H*0.7 }),
      () => ({ x: W*0.75 + Math.random()*W*0.25,   y: H*0.15 + Math.random()*H*0.7 }),
      () => ({ x: W*0.25 + Math.random()*W*0.5,    y: H*0.55 + Math.random()*H*0.35 }),
    ];
    const pos = zones[Math.floor(Math.random()*zones.length)]();
    flies.push({
      x: pos.x, y: pos.y,
      vx: (0.18 + Math.random()*0.35) * (Math.random()<0.5?1:-1),
      vy: (0.08 + Math.random()*0.20) * (Math.random()<0.5?1:-1),
      phase: Math.random()*Math.PI*2,
      freq:  1.8 + Math.random()*2.2,
      r:     1.3 + Math.random()*1.1,
      life: 0,
      maxLife: 200 + Math.random()*220,
      col: Math.random()<0.65 ? '170,255,110' : '210,255,150',
    });
  }

  function tickFF(dt) {
    ffTimer -= dt;
    if (ffTimer <= 0 && flies.length < 12) {
      spawnFF();
      if (flies.length < 6) spawnFF(); // garante vários logo no arranque
      ffTimer = 1.2 + Math.random()*2.8;
    }
    for (let i = flies.length-1; i >= 0; i--) {
      const f = flies[i];
      f.life++;
      f.x += f.vx + Math.sin(wPhase + f.x*0.02) * wStr * 0.8;
      f.y += f.vy * Math.sin(f.life * 0.018 + f.phase);
      f.phase += 0.07;
      if (f.life > f.maxLife || f.x < -30 || f.x > W+30 || f.y < -20 || f.y > H+20)
        flies.splice(i, 1);
    }
  }

  function drawFF() {
    flies.forEach(f => {
      const lr = f.life / f.maxLife;
      const fade = lr < 0.10 ? lr/0.10 : lr > 0.88 ? (1-lr)/0.12 : 1;
      const pulse = 0.35 + 0.65*(0.5 + 0.5*Math.sin(f.phase * f.freq));
      const a = fade * pulse;
      if (a < 0.02) return;
      ctx.save();
      // halo
      ctx.globalAlpha = a * 0.30;
      const h = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r*6);
      h.addColorStop(0, `rgba(${f.col},0.9)`);
      h.addColorStop(1, `rgba(${f.col},0)`);
      ctx.fillStyle = h;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r*6, 0, Math.PI*2); ctx.fill();
      // núcleo
      ctx.globalAlpha = a * 0.92;
      ctx.fillStyle = `rgba(${f.col},1)`;
      ctx.shadowColor = `rgba(${f.col},0.8)`; ctx.shadowBlur = 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });
  }

  // ── fundo escuro ──────────────────────────────────────────────────────────
  function drawBg() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0,   '#05050f');
    sky.addColorStop(0.6, '#080812');
    sky.addColorStop(1,   '#060d04');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
  }

  // ── loop ──────────────────────────────────────────────────────────────────
  // Spawnar alguns pirilampos imediatamente para não começar vazio
  for (let i = 0; i < 6; i++) spawnFF();

  let last = 0, raf = null;
  function tick(ts) {
    const dt = Math.min((ts - last)/1000, 0.05); last = ts;
    const t  = ts / 1000;
    tickWind(dt);
    tickFF(dt);
    ctx.clearRect(0, 0, W, H);
    drawBg();
    drawLight();
    drawFog(t);
    drawFF();
    raf = requestAnimationFrame(tick);
  }

  const panel = document.getElementById('panelLeader');
  new MutationObserver(() => {
    const hidden = panel.classList.contains('hidden');
    if (!hidden && !raf) {
      raf = requestAnimationFrame(ts => { last = ts; raf = requestAnimationFrame(tick); });
    } else if (hidden && raf) {
      cancelAnimationFrame(raf); raf = null;
    }
  }).observe(panel, { attributes: true, attributeFilter: ['class'] });
})();
